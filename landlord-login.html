<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Login - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  font-family:Arial, sans-serif;
  background:
    linear-gradient(135deg,rgba(15,23,42,.88),rgba(14,116,144,.72)),
    url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1400&q=80") center/cover;
}
.box{
  width:100%;
  max-width:410px;
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 24px 70px rgba(15,23,42,0.34);
  position:relative;
  overflow:hidden;
}
.box:before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:7px;
  background:linear-gradient(90deg,#22c55e,#06b6d4,#f97316);
}
h1{font-size:28px;margin:6px 0 6px;text-align:center;color:#0f172a}
p{color:#5b6472;text-align:center;line-height:1.5}
label{display:block;margin-top:14px;font-weight:bold}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  background:#f8fafc;
}
input:focus{outline:2px solid #67e8f9;border-color:#0891b2;background:white}
button{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#0f172a,#0e7490);
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 12px 26px rgba(14,116,144,.28);
}
button:disabled{background:#94a3b8;cursor:not-allowed}
.link{display:block;margin-top:16px;text-align:center;color:#0e7490;text-decoration:none;font-weight:bold}
.msg{margin-top:12px;text-align:center;font-size:14px;color:#b91c1c}
</style>
</head>
<body>

<div class="box">
  <h1>Landlord Login</h1>
  <p>Upload and track your rental houses.</p>

  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn" onclick="login()">Login</button>
  <a class="link" href="landlord-signup.html">Create landlord account</a>
  <div id="msg" class="msg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("loginBtn");

  if(!email || !password){
    msg.innerText = "Please enter email and password.";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try{
    await auth.signInWithEmailAndPassword(email,password);
    window.location.href="landlord-dashboard.html";
  }
  catch(error){
    msg.innerText = error.message;
    btn.disabled = false;
    btn.innerText = "Login";
  }
}
</script>
</body>
</html>
