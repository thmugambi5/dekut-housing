<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;}
.box{background:white;padding:20px;border-radius:12px;width:340px;}
input{width:100%;padding:12px;margin:8px 0;}
button{width:100%;padding:12px;background:#2563eb;color:white;border:none;}
.msg{text-align:center;margin-top:10px;}
</style>
</head>

<body>

<div class="box">
<h2>Landlord Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<div class="msg" id="msg"></div>
</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

async function login(){

try{

const res = await auth.signInWithEmailAndPassword(
document.getElementById("email").value,
document.getElementById("password").value
);

document.getElementById("msg").innerText="Login success";

setTimeout(()=>{
window.location.href="landlord-dashboard.html";
},800);

}catch(e){
document.getElementById("msg").innerText=e.message;
}

}

</script>

</body>
</html>
