<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:20px;
border-radius:12px;
width:320px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Landlord Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

const res = await auth.signInWithEmailAndPassword(email,password);

document.getElementById("msg").innerText = "Login success";

setTimeout(()=>{
window.location.href = "landlord-dashboard.html";
},800);

}catch(e){
document.getElementById("msg").innerText = e.message;
}

}

</script>

</body>
</html>
