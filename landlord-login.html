<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>

<body>

<h2>Landlord Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password"><br><br>

<button onclick="login()">Login</button>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try {

const cred = await auth.signInWithEmailAndPassword(email, password);

const user = cred.user;

/* VERIFY LANDLORD EXISTS */
const snap = await db.ref("landlords/" + user.uid).once("value");

if(!snap.exists()){
await auth.signOut();
alert("Not a registered landlord");
return;
}

window.location.href = "landlord-dashboard.html";

} catch(e){
alert(e.message);
}
}

</script>

</body>
</html>
