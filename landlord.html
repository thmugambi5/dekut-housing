<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6fb;}
.container{max-width:900px;margin:auto;padding:20px;}
.card{background:white;padding:15px;margin-top:15px;border-radius:12px;}

input,select,textarea,button{
width:100%;padding:10px;margin-top:10px;
border-radius:8px;border:1px solid #ddd;
}

button{background:#2563eb;color:white;border:none;cursor:pointer;}
button:hover{background:#1d4ed8;}

.hidden{display:none;}

.badge{padding:4px 8px;border-radius:6px;color:white;font-size:12px;}
.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

img.preview{width:100px;height:80px;object-fit:cover;margin:5px;border-radius:6px;}
</style>
</head>

<body>

<div class="container">

<div id="authBox" class="card">
<h2>Landlord Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()" style="background:green;">Signup</button>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>Welcome <span id="user"></span></h2>
<button onclick="logout()" style="background:red;">Logout</button>
</div>

<div class="card">
<h3>Upload Property</h3>

<select id="type">
<option>Single Room</option>
<option>Bedsitter</option>
<option>1 Bedroom</option>
<option>2 Bedroom</option>
</select>

<input id="location" placeholder="Location">
<input id="rent" type="number" placeholder="Rent">
<input id="phone" placeholder="Phone (254...)">
<textarea id="desc" placeholder="Description"></textarea>

<input type="file" id="images" multiple onchange="convertImages()">
<div id="preview"></div>

<button onclick="submitProperty()">Submit</button>
</div>

<div class="card">
<h3>Your Properties</h3>
<div id="list"></div>
</div>

</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGZ0Ozz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser=null;
let images=[];

function signup(){
auth.createUserWithEmailAndPassword(email.value,password.value)
.then(r=>{currentUser=r.user; show();});
}

function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.then(r=>{currentUser=r.user; show();});
}

function show(){
authBox.classList.add("hidden");
dashboard.classList.remove("hidden");
user.innerText=currentUser.email;
load();
}

function convertImages(){
images=[];
preview.innerHTML="";
for(let f of images.files){}
}

function submitProperty(){

let id = db.ref("properties").push().key;

db.ref("properties/"+id).set({
owner:currentUser.uid,
type:type.value,
location:location.value,
rent:rent.value,
phone:phone.value,
desc:desc.value,
images:images,
status:"pending",
createdAt:Date.now()
});

alert("Submitted");
load();
}

function load(){
db.ref("properties").on("value",snap=>{
let d=snap.val()||{};
let html="";

for(let id in d){
let p=d[id];
if(p.owner!==currentUser.uid) continue;

html += `
<div class="card">
<b>${p.type}</b>
<span class="badge ${p.status}">${p.status}</span><br>
📍 ${p.location}<br>
💰 ${p.rent}<br>
</div>`;
}

list.innerHTML=html;
});
}

auth.onAuthStateChanged(u=>{
if(u){currentUser=u;show();}
});

function logout(){auth.signOut();location.reload();}
</script>

</body>
</html>
