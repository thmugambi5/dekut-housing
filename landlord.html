<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f7f7f7;padding:20px;}
.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px;}
input,select,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;}
button{background:#ff385c;color:white;border:none;cursor:pointer;}
img{width:70px;height:70px;object-fit:cover;margin:5px;border-radius:8px;}
#preview{display:flex;flex-wrap:wrap;}
#locStatus{font-size:13px;color:green;}
</style>
</head>

<body>

<div class="card">
<h2>🏠 Add Property</h2>

<select id="type">
<option>Bedsitter</option>
<option>Single Room</option>
<option>One Bedroom</option>
<option>Shared Bedsitter</option>
<option>Shared Single Room</option>
</select>

<input id="rent" placeholder="Rent (KSh)">
<input id="location" placeholder="Location">
<input id="distance" type="number" step="0.1" placeholder="Distance from DeKUT (KM)">
<input id="phone" placeholder="Phone / WhatsApp">
<input id="amenities" placeholder="Amenities">

<button onclick="getLocation()">📍 Share My Location</button>
<p id="locStatus">No location selected</p>

<input type="file" id="images" multiple>

<div id="preview"></div>

<button onclick="upload()">Upload Property</button>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// GPS variables
let lat = "";
let lng = "";

// GET LOCATION
function getLocation(){

  if(!navigator.geolocation){
    alert("Geolocation not supported");
    return;
  }

  document.getElementById("locStatus").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (pos)=>{

      lat = pos.coords.latitude;
      lng = pos.coords.longitude;

      document.getElementById("locStatus").innerText =
        "Location captured ✔";

    },
    ()=>{
      document.getElementById("locStatus").innerText =
        "Failed to get location";
    }
  );
}

// base64 image
function toBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// preview
document.getElementById("images").onchange = async function(e){
  let preview = document.getElementById("preview");
  preview.innerHTML = "";

  for(let f of e.target.files){
    let url = await toBase64(f);
    let img = document.createElement("img");
    img.src = url;
    preview.appendChild(img);
  }
};

// upload
async function upload(){

  if(!lat || !lng){
    alert("Please share your location first 📍");
    return;
  }

  let files = document.getElementById("images").files;

  let images = [];
  for(let f of files){
    images.push(await toBase64(f));
  }

  let data = {
    type: document.getElementById("type").value || "",
    rent: document.getElementById("rent").value || "",
    location: document.getElementById("location").value || "",
    distance: document.getElementById("distance").value || "",
    phone: document.getElementById("phone").value || "",
    amenities: document.getElementById("amenities").value || "",
    lat: lat,
    lng: lng,
    images: images,
    createdAt: Date.now()
  };

  db.ref("properties").push(data);

  alert("Property uploaded ✔");
}

</script>

</body>
</html>
