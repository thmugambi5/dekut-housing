<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Dashboard (No Storage)</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#f7f7f7;margin:0;padding:20px;}
.card{background:#fff;padding:20px;border-radius:12px;max-width:600px;margin:auto;}
input,select{width:100%;padding:10px;margin:8px 0;}
button{width:100%;padding:12px;background:#ff385c;color:#fff;border:none;}
img{width:80px;height:80px;object-fit:cover;margin:5px;border-radius:8px;}
</style>
</head>

<body>

<div class="card">
<h2>Upload Property</h2>

<select id="type">
<option>Bedsitter</option>
<option>Single Room</option>
<option>One Bedroom</option>
<option>Shared Bedsitter</option>
<option>Shared Single Room</option>
</select>

<input id="rent" placeholder="Rent">
<input id="location" placeholder="Location">
<input id="distance" placeholder="Distance (KM)">
<input id="phone" placeholder="Phone">

<input type="file" id="images" multiple>

<div id="preview"></div>

<button onclick="upload()">Upload</button>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// convert image → base64
function toBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// preview
document.getElementById("images").onchange = async function(e){
  let preview = document.getElementById("preview");
  preview.innerHTML = "";

  for(let file of e.target.files){
    let url = await toBase64(file);
    let img = document.createElement("img");
    img.src = url;
    preview.appendChild(img);
  }
};

async function upload(){

  let files = document.getElementById("images").files;

  let images = [];
  for(let file of files){
    images.push(await toBase64(file));
  }

  let data = {
    type: type.value,
    rent: rent.value,
    location: location.value,
    distance: distance.value,
    phone: phone.value,
    images: images,
    createdAt: Date.now()
  };

  db.ref("properties").push(data);

  alert("Uploaded successfully!");
}

</script>

</body>
</html>
