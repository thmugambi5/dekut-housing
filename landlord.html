<div class="card">
<h2>🏠 Landlord Upload Form</h2>

<!-- PROPERTY DETAILS -->
<div class="section">
<h3>Property Details</h3>

<select id="type">
<option>Bedsitter</option>
<option>Single Room</option>
<option>One Bedroom</option>
<option>Shared Bedsitter</option>
<option>Shared Single Room</option>
</select>

<input id="rent" placeholder="Rent (KSh)">

<select id="gender">
<option>Any Gender</option>
<option>Male Only</option>
<option>Female Only</option>
<option>Mixed</option>
</select>

<input id="extra" placeholder="Extra Information">
</div>

<!-- CONTACT -->
<div class="section">
<h3>Contact</h3>

<input id="phone" placeholder="Phone (Kenya format e.g. 2547XXXXXXXX)">
</div>

<!-- AMENITIES -->
<div class="section">
<h3>Amenities</h3>

<label><input type="checkbox" class="amenity" value="WiFi"> WiFi</label>
<label><input type="checkbox" class="amenity" value="Water"> Water</label>
<label><input type="checkbox" class="amenity" value="Electricity"> Electricity</label>
<label><input type="checkbox" class="amenity" value="Furnished"> Furnished</label>
<label><input type="checkbox" class="amenity" value="Parking"> Parking</label>
<label><input type="checkbox" class="amenity" value="Security"> Security</label>

<input id="extraAmenities" placeholder="Other amenities">
</div>

<!-- PHOTOS -->
<div class="section">
<h3>Photos</h3>

<input type="file" id="images" multiple>
<div class="preview" id="preview"></div>
</div>

<!-- LOCATION (NOW LAST) -->
<div class="section">
<h3>Location</h3>

<button onclick="getLocation()">📍 Share GPS Location</button>
<p id="locStatus">No location selected</p>

<input id="location" placeholder="Estate / Area (e.g. Bomas, Nanyuki)">
</div>

<!-- UPLOAD BUTTON -->
<button onclick="upload()">Upload Property</button>
</div>
