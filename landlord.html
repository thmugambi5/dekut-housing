<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord System Phase 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6fb;}
.container{max-width:900px;margin:auto;padding:20px;}

.card{background:#fff;padding:15px;margin-top:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
input,select,button,textarea{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ddd;}
button{background:#2563eb;color:white;border:none;cursor:pointer;}
button:hover{background:#1d4ed8;}

.hidden{display:none;}

.badge{padding:4px 8px;border-radius:6px;color:white;font-size:12px;}
.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

.preview{width:80px;height:60px;object-fit:cover;margin:4px;border-radius:6px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.smallBtn{flex:1;padding:8px;font-size:12px;}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div id="authBox" class="card">
<h2>Landlord Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">

<div class="card">
<h3>Welcome</h3>
<button onclick="logout()" style="background:red;">Logout</button>
</div>

<!-- UPLOAD -->
<div class="card">
<h3>Upload Property</h3>

<input id="name" placeholder="Property Name *">
<select id="type">
<option>Single Room</option>
<option>Bedsitter</option>
<option>Shared (2 people)</option>
<option>Shared (3+ people)</option>
<option>1 Bedroom</option>
</select>

<input id="location" placeholder="Area (e.g. Bomas, Chania)">
<input id="rent" type="number" placeholder="Rent">
<input id="deposit" type="number" placeholder="Deposit">
<input id="phone" placeholder="Phone (254...)">

<textarea id="desc" placeholder="Description"></textarea>

<h4>GPS</h4>
<button onclick="getGPS()">Capture Location</button>

<h4>Images (max 10)</h4>
<input type="file" id="images" multiple accept="image/*" onchange="handleImages()">
<div id="preview"></div>

<button onclick="submitProperty()">Submit</button>
</div>

<!-- LIST -->
<div class="card">
<h3>My Properties</h3>
<div id="list"></div>
</div>

</div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let user=null;
let imgs=[];
let lat=null,lng=null;

/* AUTH FIXED */
window.signup=function(){
auth.createUserWithEmailAndPassword(email.value,password.value);
}

window.login=function(){
auth.signInWithEmailAndPassword(email.value,password.value);
}

auth.onAuthStateChanged(u=>{
if(u){
user=u;
authBox.classList.add("hidden");
dash.classList.remove("hidden");
load();
}else{
authBox.classList.remove("hidden");
dash.classList.add("hidden");
}
});

window.logout=function(){
auth.signOut();
location.reload();
}

/* GPS */
window.getGPS=function(){
navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude;
lng=p.coords.longitude;
alert("GPS saved");
});
}

/* IMAGES */
window.handleImages=function(){
let files=images.files;
imgs=[];
preview.innerHTML="";
for(let i=0;i<files.length && i<10;i++){
let r=new FileReader();
r.onload=e=>{
imgs.push(e.target.result);
preview.innerHTML+=`<img class="preview" src="${e.target.result}">`;
};
r.readAsDataURL(files[i]);
}
}

/* DISTANCE (simple approx) */
function distanceFromDekut(lat2,lng2){
const dekutLat=-0.4216;
const dekutLng=36.9476;
return Math.sqrt((dekutLat-lat2)**2+(dekutLng-lng2)**2).toFixed(3);
}

/* SUBMIT ONLY TO PENDING */
window.submitProperty=function(){

if(!name.value || !type.value){
alert("Name and Type required");
return;
}

let data={
owner:user.uid,
name:name.value,
type:type.value,
location:location.value,
rent:Number(rent.value),
deposit:Number(deposit.value),
phone:phone.value,
description:desc.value,
images:imgs,
lat:lat,
lng:lng,
distance:(lat && lng)?distanceFromDekut(lat,lng):null,
status:"pending",
createdAt:Date.now()
};

db.ref("pendingProperties").push(data);

clearForm();
load();
}

/* LOAD OWN PROPERTIES */
function load(){
db.ref("pendingProperties").on("value",snap=>{
let d=snap.val()||{};
let html="";
for(let id in d){
let p=d[id];
if(p.owner!==user.uid) continue;

html+=`
<div class="card">
<b>${p.name}</b>
<span class="badge pending">${p.status}</span><br>
${p.type}<br>
${p.location}<br>
Rent: ${p.rent}<br>
<button onclick="del('${id}')">Delete</button>
</div>`;
}
list.innerHTML=html;
});
}

/* DELETE */
window.del=function(id){
db.ref("pendingProperties/"+id).remove();
}

/* CLEAR */
function clearForm(){
name.value="";
type.value="";
location.value="";
rent.value="";
deposit.value="";
phone.value="";
desc.value="";
imgs=[];
preview.innerHTML="";
lat=null;lng=null;
}
</script>

</body>
</html>
