<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; background:#f4f4f4; margin:0; }
.container { max-width:900px; margin:auto; padding:20px; }

.card {
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, textarea, button {
    width:100%;
    padding:10px;
    margin-top:10px;
}

button {
    background:#2c7be5;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover { background:#1a5dc9; }

.hidden { display:none; }

.switch {
    margin-top:10px;
    cursor:pointer;
    color:blue;
}

.property {
    border:1px solid #ddd;
    padding:10px;
    margin-top:10px;
}

.smallBtn{
    width:auto;
    padding:8px 12px;
    margin-top:5px;
    background:#444;
}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div id="authBox" class="card">
    <h2 id="authTitle">Create Account</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="handleAuth()">Continue</button>

    <div class="switch" onclick="toggleMode()">
        Already have an account? Login instead
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

    <div class="card">
        <h2>Welcome, <span id="userName"></span></h2>
        <button onclick="logout()" style="background:red;">Logout</button>
    </div>

    <!-- PROPERTY FORM -->
    <div class="card">
        <h3>Add Property</h3>

        <input type="hidden" id="editIndex">

        <input type="text" id="title" placeholder="Property Title">
        <input type="text" id="location" placeholder="Location">
        <input type="number" id="rent" placeholder="Rent (KSh)">
        <input type="text" id="phone" placeholder="Phone Number">
        <input type="text" id="amenities" placeholder="Amenities (wifi, parking...)">

        <textarea id="description" placeholder="Description"></textarea>

        <!-- GPS -->
        <button class="smallBtn" onclick="getLocation()">📍 Share My Location</button>
        <div id="gpsText"></div>

        <!-- IMAGES -->
        <input type="file" id="images" multiple accept="image/*">

        <button onclick="saveProperty()">Save Property</button>
    </div>

    <div class="card">
        <h3>Your Properties</h3>
        <div id="list"></div>
    </div>

</div>

</div>

<script>

let mode = "signup";

let lat = null;
let lng = null;
let imageData = [];

// ===== AUTH MODE =====
function toggleMode(){

    if(mode === "signup"){
        mode = "login";
        document.getElementById("authTitle").innerText = "Login";
        document.querySelector(".switch").innerText = "Don't have an account? Create one";
    } else {
        mode = "signup";
        document.getElementById("authTitle").innerText = "Create Account";
        document.querySelector(".switch").innerText = "Already have an account? Login instead";
    }
}

// ===== STORAGE =====
function getUsers(){
    return JSON.parse(localStorage.getItem("users") || "[]");
}
function saveUsers(u){
    localStorage.setItem("users", JSON.stringify(u));
}

function getProperties(){
    return JSON.parse(localStorage.getItem("properties") || "[]");
}
function saveProperties(p){
    localStorage.setItem("properties", JSON.stringify(p));
}

// ===== AUTH =====
function handleAuth(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let users = getUsers();

    if(mode === "signup"){

        if(users.find(u => u.email === email)){
            alert("Account already exists");
            return;
        }

        let newUser = {name, email, password};
        users.push(newUser);
        saveUsers(users);

        localStorage.setItem("currentUser", JSON.stringify(newUser));
        showDashboard();
        return;
    }

    let user = users.find(u => u.email === email && u.password === password);

    if(!user){
        alert("Invalid login");
        return;
    }

    localStorage.setItem("currentUser", JSON.stringify(user));
    showDashboard();
}

// ===== DASHBOARD =====
function showDashboard(){

    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    let user = JSON.parse(localStorage.getItem("currentUser"));
    document.getElementById("userName").innerText = user.name;

    render();
}

// ===== GPS =====
function getLocation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
            lat = pos.coords.latitude;
            lng = pos.coords.longitude;
            document.getElementById("gpsText").innerText =
            `📍 Location saved: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        });
    } else {
        alert("GPS not supported");
    }
}

// ===== IMAGES =====
document.getElementById("images").addEventListener("change", function(e){

    imageData = [];

    for(let file of e.target.files){

        let reader = new FileReader();

        reader.onload = function(evt){
            imageData.push(evt.target.result);
        }

        reader.readAsDataURL(file);
    }

});

// ===== SAVE PROPERTY =====
function saveProperty(){

    let user = JSON.parse(localStorage.getItem("currentUser"));

    let props = getProperties();

    let data = {
        owner: user.email,
        title: document.getElementById("title").value,
        location: document.getElementById("location").value,
        rent: document.getElementById("rent").value,
        phone: document.getElementById("phone").value,
        amenities: document.getElementById("amenities").value,
        description: document.getElementById("description").value,
        images: imageData,
        lat,
        lng,
        status: "pending"   // 🔥 MUST go to admin approval
    };

    props.push(data);

    saveProperties(props);

    clearForm();
    render();
}

// ===== DISPLAY =====
function render(){

    let user = JSON.parse(localStorage.getItem("currentUser"));
    let props = getProperties();

    let html = "";

    props.forEach((p,i)=>{

        if(p.owner === user.email){

            html += `
            <div class="property">

                <b>${p.title}</b>
                <small>(${p.status})</small><br>

                📍 ${p.location}<br>
                💰 KSh ${p.rent}<br>
                📞 ${p.phone}<br>

                <small>${p.amenities}</small><br>

                <button onclick="edit(${i})">Edit</button>
                <button onclick="del(${i})" style="background:red;">Delete</button>

            </div>
            `;
        }

    });

    document.getElementById("list").innerHTML = html;
}

// ===== EDIT =====
function edit(i){
    let props = getProperties();
    let p = props[i];

    document.getElementById("title").value = p.title;
    document.getElementById("location").value = p.location;
    document.getElementById("rent").value = p.rent;
    document.getElementById("phone").value = p.phone;
    document.getElementById("amenities").value = p.amenities;
    document.getElementById("description").value = p.description;
}

// ===== DELETE =====
function del(i){
    let props = getProperties();
    props.splice(i,1);
    saveProperties(props);
    render();
}

// ===== CLEAR =====
function clearForm(){
    document.getElementById("title").value="";
    document.getElementById("location").value="";
    document.getElementById("rent").value="";
    document.getElementById("phone").value="";
    document.getElementById("amenities").value="";
    document.getElementById("description").value="";
    document.getElementById("images").value="";
    lat=null;
    lng=null;
    imageData=[];
}

// ===== AUTO LOGIN =====
window.onload = function(){
    if(localStorage.getItem("currentUser")){
        showDashboard();
    }
}

</script>

</body>
</html>
