<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Portal Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f7fb;}
.container{max-width:900px;margin:auto;padding:20px;}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px;}
input,select,textarea,button{width:100%;padding:10px;margin:5px 0;}
button{background:#2563eb;color:#fff;border:none;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:5px;}
img{width:100%;height:100px;object-fit:cover;}
.badge{padding:4px 6px;border-radius:5px;color:#fff;}
.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<div id="loginBox" class="card">
<h3>Landlord Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<div id="dash" class="hidden">

<div class="card">
<h3>Upload Property</h3>

<input id="name" placeholder="Property Name">
<select id="type">
<option>Single Room</option>
<option>Shared Room</option>
<option>Bedsitter</option>
</select>

<input id="location" placeholder="Location">
<input id="rent" type="number" placeholder="Rent">
<input id="deposit" type="number" placeholder="Deposit">
<input id="phone" placeholder="Phone">

<textarea id="desc" placeholder="Description"></textarea>

<button onclick="captureGPS()">Capture GPS</button>

<input type="file" id="imgInput" multiple accept="image/*" onchange="loadImages()">

<button onclick="submit()">Submit</button>
</div>

<div class="card">
<h3>My Properties</h3>
<div id="list"></div>
</div>

</div>

</div>

<script>

const firebaseConfig={apiKey:" "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",",authDomain:"dekut-housing.firebaseapp.com",databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",projectId:"dekut-housing"};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let user=null;
let images=[];
let lat=null,lng=null;

/* AUTH */
auth.onAuthStateChanged(u=>{
if(u){
user=u;
loginBox.classList.add("hidden");
dash.classList.remove("hidden");
load();
}
});

function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.catch(e=>msg.innerText=e.message);
}

/* GPS */
function captureGPS(){
navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude;
lng=p.coords.longitude;
alert("GPS saved");
});
}

/* IMAGES */
function loadImages(){
const files=document.getElementById("imgInput").files;
images=[];
for(let f of files){
const r=new FileReader();
r.onload=e=>images.push(e.target.result);
r.readAsDataURL(f);
}
}

/* SUBMIT */
function submit(){

if(!name.value || !location.value) return alert("Fill required fields");

db.ref("pendingProperties").push({
ownerId:user.uid,
name:name.value,
type:type.value,
location:location.value,
rent:rent.value,
deposit:deposit.value,
phone:phone.value,
description:desc.value,
images,
lat,
lng,
status:"pending",
time:Date.now()
});

alert("Submitted");
}

/* LOAD */
function load(){
db.ref("pendingProperties").on("value",snap=>{
let data=snap.val()||{};
let html="";

for(let id in data){
let p=data[id];
if(p.ownerId!==user.uid) continue;

html+=`
<div class="card">
<h3>${p.name}</h3>
<span class="badge ${p.status}">${p.status}</span>
<p>${p.location}</p>
</div>`;
}

list.innerHTML=html;
});
}

</script>

</body>
</html>
