<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
color:black;
padding:20px;
border-radius:12px;
width:320px;
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.login{background:#2563eb;color:white;}
.signup{background:#16a34a;color:white;}
</style>
</head>

<body>

<div class="box">
<h2>🏠 Landlord Portal</h2>

<button class="login" onclick="goLogin()">Login</button>
<button class="signup" onclick="goSignup()">Create Account</button>
</div>

<script>
function goLogin(){
window.location.href="landlord-login.html";
}

function goSignup(){
window.location.href="landlord-signup.html";
}
</script>

</body>
</html>
