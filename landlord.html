<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; margin:0; }
.container { max-width:900px; margin:auto; padding:20px; }

.card {
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, textarea, button {
    width:100%;
    padding:10px;
    margin-top:10px;
}

button {
    background:#2c7be5;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover { background:#1a5dc9; }

.hidden { display:none; }

.switch {
    margin-top:10px;
    cursor:pointer;
    color:blue;
}

.property {
    border:1px solid #ddd;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div id="authBox" class="card">
    <h2 id="authTitle">Create Account</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="handleAuth()">Continue</button>

    <div class="switch" onclick="toggleMode()">
        Already have an account? Login instead
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

    <div class="card">
        <h2>Welcome, <span id="userName"></span></h2>
        <button onclick="logout()" style="background:red;">Logout</button>
    </div>

    <!-- PROPERTY FORM -->
    <div class="card">
        <h3>Add Property (Pending Approval)</h3>

        <input type="hidden" id="editId">

        <input type="text" id="title" placeholder="Property Title">
        <input type="text" id="location" placeholder="Location">
        <input type="number" id="rent" placeholder="Rent (KSh)">
        <input type="text" id="phone" placeholder="Phone Number">
        <textarea id="description" placeholder="Description"></textarea>

        <button onclick="getLocation()">📍 Share My Location</button>
        <p id="gps"></p>

        <button onclick="saveProperty()">Submit Property</button>
    </div>

    <div class="card">
        <h3>Your Properties</h3>
        <div id="list"></div>
    </div>

</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGZ0zOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing",
storageBucket:"dekut-housing.appspot.com",
messagingSenderId:"784034754945",
appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* MODE */
let mode = "signup";

/* GPS */
let lat = null;
let lng = null;

/* TOGGLE AUTH */
function toggleMode(){

if(mode === "signup"){
mode = "login";
document.getElementById("authTitle").innerText = "Login";
document.querySelector(".switch").innerText = "Don't have an account? Create one";
} else {
mode = "signup";
document.getElementById("authTitle").innerText = "Create Account";
document.querySelector(".switch").innerText = "Already have an account? Login instead";
}
}

/* AUTH (LOCAL ONLY USERS STILL OK) */
function getUsers(){
return JSON.parse(localStorage.getItem("users") || "[]");
}

function saveUsers(u){
localStorage.setItem("users", JSON.stringify(u));
}

/* AUTH HANDLER */
function handleAuth(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

let users = getUsers();

if(mode === "signup"){

if(users.find(u => u.email === email)){
alert("Account exists");
return;
}

let newUser = {name,email,password};
users.push(newUser);
saveUsers(users);

localStorage.setItem("currentUser", JSON.stringify(newUser));
showDashboard();
return;
}

let user = users.find(u => u.email === email && u.password === password);

if(!user){
alert("Invalid login");
return;
}

localStorage.setItem("currentUser", JSON.stringify(user));
showDashboard();
}

/* DASHBOARD */
function showDashboard(){

document.getElementById("authBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

let user = JSON.parse(localStorage.getItem("currentUser"));
document.getElementById("userName").innerText = user.name;

loadMyProperties(user.email);
}

/* GPS */
function getLocation(){

navigator.geolocation.getCurrentPosition(pos=>{

lat = pos.coords.latitude;
lng = pos.coords.longitude;

document.getElementById("gps").innerText =
`📍 Saved: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

});

}

/* SAVE TO FIREBASE (🔥 FIXED CONNECTION) */
function saveProperty(){

let user = JSON.parse(localStorage.getItem("currentUser"));

let data = {
owner: user.email,
title: document.getElementById("title").value,
location: document.getElementById("location").value,
rent: document.getElementById("rent").value,
phone: document.getElementById("phone").value,
description: document.getElementById("description").value,
lat,
lng,
status: "pending",
approved: false,
createdAt: Date.now()
};

/* 🔥 PUSH TO FIREBASE */
db.ref("pendingProperties").push(data);

clearForm();
alert("Submitted for admin approval!");
loadMyProperties(user.email);
}

/* LOAD USER PROPERTIES */
function loadMyProperties(email){

db.ref("pendingProperties").on("value",snap=>{

let data = snap.val() || {};
let html = "";

for(let id in data){

let p = data[id];

if(p.owner === email){

html += `
<div class="property">

<b>${p.title}</b><br>
📍 ${p.location}<br>
💰 KSh ${p.rent}<br>
<small>Status: ${p.status}</small>

</div>
`;
}

}

document.getElementById("list").innerHTML = html;

});

}

/* CLEAR */
function clearForm(){
document.getElementById("title").value="";
document.getElementById("location").value="";
document.getElementById("rent").value="";
document.getElementById("phone").value="";
document.getElementById("description").value="";
lat=null;
lng=null;
}

/* EDIT SAFE RESET (optional later) */
function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

/* AUTO LOGIN */
window.onload = function(){
if(localStorage.getItem("currentUser")){
showDashboard();
}
}

</script>

</body>
</html>
