<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f7f7f7;padding:20px;}
.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px;}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;}
button{width:100%;padding:12px;background:#ff385c;color:white;border:none;border-radius:8px;}
img{width:70px;height:70px;object-fit:cover;margin:5px;border-radius:8px;}
#preview{display:flex;flex-wrap:wrap;}
</style>
</head>

<body>

<div class="card">
<h2>🏠 Add Property (Landlord)</h2>

<!-- ORIGINAL TYPE OPTIONS + FIXED SHARED ROOM -->
<select id="type">
<option value="">Select Property Type</option>
<option>Bedsitter</option>
<option>Single Room</option>
<option>One Bedroom</option>
<option>Shared Bedsitter</option>
<option>Shared Single Room</option>
</select>

<input id="rent" type="number" placeholder="Monthly Rent (KSh)">

<input id="location" placeholder="Location (Estate / Area)">

<input id="distance" type="number" step="0.1" placeholder="Distance from DeKUT (KM)">

<select id="gender">
<option>Any Gender</option>
<option>Male Only</option>
<option>Female Only</option>
<option>Mixed</option>
</select>

<input id="amenities" placeholder="Amenities (Water, WiFi, etc)">

<input id="phone" placeholder="Phone / WhatsApp">

<input id="extra" placeholder="Extra Information">

<input type="file" id="images" multiple>

<div id="preview"></div>

<button onclick="upload()">Upload Property</button>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// convert image → base64
function toBase64(file){
  return new Promise((res,rej)=>{
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

// preview images
document.getElementById("images").onchange = async function(e){
  let preview = document.getElementById("preview");
  preview.innerHTML = "";

  for(let file of e.target.files){
    let url = await toBase64(file);
    let img = document.createElement("img");
    img.src = url;
    preview.appendChild(img);
  }
};

// SAFE upload (fixes undefined error)
async function upload(){

  let files = document.getElementById("images").files;

  let images = [];
  for(let f of files){
    images.push(await toBase64(f));
  }

  let data = {
    type: document.getElementById("type").value || "",
    rent: document.getElementById("rent").value || "",
    location: document.getElementById("location").value || "",
    distance: document.getElementById("distance").value || "",
    gender: document.getElementById("gender").value || "",
    amenities: document.getElementById("amenities").value || "",
    phone: document.getElementById("phone").value || "",
    extra: document.getElementById("extra").value || "",
    images: images,
    createdAt: Date.now()
  };

  db.ref("properties").push(data);

  alert("Property uploaded successfully!");
}

</script>

</body>
</html>
