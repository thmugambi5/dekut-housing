<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:340px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.msg{
    text-align:center;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Admin Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="btn" onclick="login()">Login</button>

<div class="msg" id="msg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "admin@dekut.com";

function generateToken(){
    return "adm_" + Math.random().toString(36).substring(2) + Date.now();
}

async function login(){

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    msg.innerText = "Logging in...";
    btn.disabled = true;

    try{

        const res = await auth.signInWithEmailAndPassword(email, password);
        const user = res.user;

        // ❌ BLOCK NON ADMIN EMAILS
        if(user.email !== ADMIN_EMAIL){
            await auth.signOut();
            msg.innerText = "Not authorized";
            btn.disabled = false;
            return;
        }

        const token = generateToken();

        // store session
        await db.ref("adminSessions/" + user.uid).set({
            token: token,
            createdAt: Date.now()
        });

        msg.innerText = "Login successful";

        setTimeout(()=>{
            window.location.href = "admin.html?token=" + token;
        },800);

    }catch(err){
        msg.innerText = err.message;
        btn.disabled = false;
    }
}
</script>

</body>
</html>
