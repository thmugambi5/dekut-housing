<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;

/* 🔐 AUTH GATE (CRITICAL) */
auth.onAuthStateChanged(user=>{
if(!user){
window.location.href="landlord-login.html";
return;
}

currentUser = user;
loadMyListings();
});

/* UPLOAD PROPERTY */
async function upload(){

if(!currentUser){
alert("Login required");
return;
}

let images = [];
let files = document.getElementById("images").files;

for(let f of files){
images.push(await toBase64(f));
}

await db.ref("pendingProperties").push({

ownerUid: currentUser.uid,

type:document.getElementById("type").value,
rent:document.getElementById("rent").value,
deposit:document.getElementById("deposit").value,
phone:document.getElementById("phone").value,
location:document.getElementById("location").value,
extra:document.getElementById("extra").value,

images,
approved:false,
createdAt:Date.now()

});

alert("Uploaded successfully");
}

/* MY LISTINGS */
function loadMyListings(){

db.ref("pendingProperties").on("value",snap=>{

const data = snap.val() || {};
const list = document.getElementById("list");

list.innerHTML = "";

for(let id in data){

const p = data[id];

if(p.ownerUid !== currentUser.uid) continue;

list.innerHTML += `
<div class="card">
<b>${p.type}</b><br>
${p.location}<br>
KSh ${p.rent || ""}<br>

<button onclick="del('${id}')">Delete</button>
</div>
`;
}

});

}

function del(id){
db.ref("pendingProperties/"+id).remove();
}

/* BASE64 */
function toBase64(file){
return new Promise(res=>{
const r=new FileReader();
r.onload=()=>res(r.result);
r.readAsDataURL(file);
});
}

</script>
