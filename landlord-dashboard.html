<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Listings</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#f5f7fb;padding:15px;}
.card{background:white;padding:15px;margin:10px;border-radius:10px;}
button{padding:8px;margin:5px;}
</style>
</head>

<body>

<h2>My Listings</h2>
<div id="list"></div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let uid = null;

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){
window.location.href="landlord-login.html";
return;
}
uid = user.uid;
load();
});

/* LOAD ONLY OWNER DATA */
function load(){

db.ref("pendingProperties").on("value",snap=>{

const data = snap.val() || {};
const list = document.getElementById("list");

list.innerHTML = "";

for(let id in data){

const p = data[id];

if(p.ownerUid !== uid) continue;

list.innerHTML += `
<div class="card">
<h3>${p.type}</h3>
<p>${p.location}</p>
<p>KSh ${p.rent}</p>

<button onclick="del('${id}')">Delete</button>
</div>
`;

}

});

}

function del(id){
db.ref("pendingProperties/"+id).remove();
}

</script>

</body>
</html>
