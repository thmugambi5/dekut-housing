<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* LOCK SCREEN */
#lockScreen{
  position:fixed;
  inset:0;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999999;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  display:none;
}

/* CARDS */
.card{
  background:#fff;
  margin-top:15px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <h2>🔐 Verifying Access...</h2>
</div>

<div class="sidebar">
  <h2>Admin</h2>
  <button onclick="showPending()">Pending</button>
  <button onclick="showApproved()">Approved</button>
  <button onclick="logout()" style="background:red;">Logout</button>
</div>

<div class="main">

  <h1>Dashboard</h1>

  <div id="list"></div>

</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let pending = {};
let approved = {};
let mode = "pending";

/* =========================
   🔐 FINAL SECURITY LAYER
========================= */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  // STEP 1: must have session token
  const token = new URLSearchParams(window.location.search).get("token");
  if(!token){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  // STEP 2: validate session in DB
  const snap = await db.ref("adminSessions/" + user.uid).once("value");

  if(!snap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const session = snap.val();

  // STEP 3: token mismatch block
  if(session.token !== token){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  // STEP 4: expiry (24h)
  if(Date.now() - session.createdAt > 86400000){
    await db.ref("adminSessions/" + user.uid).remove();
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  // SUCCESS → unlock dashboard
  document.getElementById("lockScreen").style.display = "none";
  document.querySelector(".main").style.display = "block";
});

/* LOGOUT (invalidates session) */
function logout(){
  const user = auth.currentUser;
  if(user){
    db.ref("adminSessions/" + user.uid).remove();
  }

  auth.signOut().then(()=>{
    window.location.href = "admin-login.html";
  });
}

/* DATA */
db.ref("pendingProperties").on("value", snap=>{
  pending = snap.val() || {};
  render();
});

db.ref("properties").on("value", snap=>{
  approved = snap.val() || {};
  render();
});

/* RENDER */
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let source =
    mode==="pending" ? pending :
    mode==="approved" ? approved :
    {...pending, ...approved};

  for(let id in source){
    let p = source[id];

    list.innerHTML += `
      <div class="card">
        <b>${p.type}</b><br>
        ${p.location}<br>
        KSh ${p.rent}
      </div>
    `;
  }
}

function showPending(){ mode="pending"; render(); }
function showApproved(){ mode="approved"; render(); }

</script>

</body>
</html>
