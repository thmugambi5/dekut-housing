<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* LOADING SCREEN (NEW SECURITY LAYER UX) */
#loadingScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:99999;
}

/* HIDE APP UNTIL AUTH VERIFIED */
#app{
  display:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
  overflow:auto;
}

.sidebar h2{ margin-top:0; }

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
  font-size:15px;
}

.sidebar button:hover{ background:#333; }

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.statBox{
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* SEARCH */
.searchBox{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:15px;
  box-sizing:border-box;
}

/* CARD */
.card{
  background:white;
  margin-top:15px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.cardContent{
  padding:15px;
  line-height:1.8;
}

/* BADGES */
.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:6px;
  color:white;
  font-size:12px;
  margin-right:5px;
}

.pending{ background:orange; }
.pendingEdit{ background:#7c3aed; }
.approved{ background:green; }
.rejected{ background:#b91c1c; }
.suspended{ background:#6b7280; }
.available{ background:#28a745; }
.occupied{ background:#d32f2f; }

/* BUTTONS */
button{
  padding:10px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:4px;
  font-weight:bold;
}

.approve{ background:#28a745; color:white; }
.reject{ background:#ff9800; color:white; }
.delete{ background:#e74c3c; color:white; }
.view{ background:#111; color:white; }
.mapbtn{ background:#007bff; color:white; }
.suspend{ background:#6b7280; color:white; }
.restore{ background:#0f766e; color:white; }
.trustGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin:12px 0; }
.trustItem{ background:#f1f5f9; border-radius:8px; padding:10px; }
.trustPass{ color:#166534; font-weight:bold; }
.trustFail{ color:#b91c1c; font-weight:bold; }
.messages{background:#f8fafc;border-radius:8px;padding:10px;max-height:260px;overflow:auto;margin-top:10px}
.message{margin:8px 0;line-height:1.4}
.message b{display:block;font-size:12px;color:#64748b}

/* DETAILS MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  z-index:9999;
  overflow:auto;
}

.modalContent{
  padding:15px;
  line-height:1.8;
}

.backBtn{
  position:fixed;
  top:10px;
  left:10px;
  background:black;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  z-index:99999;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{ position:relative; width:100%; height:auto; }
  .main{ margin-left:0; }
}

</style>
</head>

<body>

<!-- 🔐 LOADING GATE (NEW SECURITY LAYER) -->
<div id="loadingScreen">
  <h2>🔐 Verifying Admin Access...</h2>
  <p>Please wait</p>
</div>

<!-- MAIN APP -->
<div id="app">

<div class="sidebar">

  <h2>🏠 Admin Panel</h2>

  <button onclick="showPending()">🟡 Pending</button>
  <button onclick="showApproved()">🟢 Approved</button>
  <button onclick="showRejected()">Rejected</button>
  <button onclick="showChats()">Chats</button>
  <button onclick="loadAll()">📦 All Listings</button>

  <button onclick="logout()" style="background:#c62828;">
    🚪 Logout
  </button>

</div>

<div class="main">

  <h1>Dashboard</h1>

  <div class="stats">

    <div class="statBox">
      <h2 id="totalPending">0</h2>
      <p>Pending</p>
    </div>

    <div class="statBox">
      <h2 id="totalApproved">0</h2>
      <p>Approved</p>
    </div>

    <div class="statBox">
      <h2 id="totalRejected">0</h2>
      <p>Rejected</p>
    </div>

  </div>

  <input id="search" class="searchBox" placeholder="Search..." oninput="render()">

  <div id="list"></div>

</div>

<div class="modal" id="detailsModal">
  <button class="backBtn" onclick="closeDetails()">⬅ Back</button>
  <div id="detailsContent"></div>
</div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const auth = firebase.auth();

let pending = {};
let approved = {};
let rejected = {};
let chats = {};
let ratings = {};
let mode = "pending";

/* 🔐 HARD SECURITY GATE */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const adminSnap = await db.ref("admins/" + user.uid).once("value");

  if(!adminSnap.exists()){
    auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* SUCCESS: UNLOCK APP */
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("app").style.display = "block";

  /* START REALTIME ONLY AFTER AUTH */
  startRealtime();

});

/* REALTIME DATA ONLY AFTER AUTH */
function startRealtime(){

  db.ref("pendingProperties").on("value", snap=>{
    pending = snap.val() || {};
    updateStats();
    render();
  });

  db.ref("properties").on("value", snap=>{
    approved = snap.val() || {};
    updateStats();
    render();
  });

  db.ref("rejectedProperties").on("value", snap=>{
    rejected = snap.val() || {};
    updateStats();
    render();
  });

  db.ref("chats").on("value", snap=>{
    chats = snap.val() || {};
    if(mode === "chats") render();
  });

  db.ref("ratings").on("value", snap=>{
    ratings = snap.val() || {};
    render();
  });

}

function logout(){
  auth.signOut().then(()=>{
    window.location.href = "admin-login.html";
  });
}

function updateStats(){
  document.getElementById("totalPending").innerText =
    Object.keys(pending).length;

  document.getElementById("totalApproved").innerText =
    Object.keys(approved).length;

  document.getElementById("totalRejected").innerText =
    Object.keys(rejected).length;
}

function showPending(){ mode="pending"; render(); }
function showApproved(){ mode="approved"; render(); }
function showRejected(){ mode="rejected"; render(); }
function showChats(){ mode="chats"; render(); }
function loadAll(){ mode="all"; render(); }

function safe(obj){
  return encodeURIComponent(JSON.stringify(obj));
}

function getRatingSummary(propertyId){
  const propertyRatings = ratings[propertyId] || {};
  const values = Object.values(propertyRatings).map(item=>Number(item.rating || 0)).filter(Boolean);
  if(values.length === 0) return "No ratings yet";
  const total = values.reduce((sum, rating)=>sum + rating, 0);
  const avg = total / values.length;
  return renderStars(avg) + " " + avg.toFixed(1) + " (" + values.length + ")";
}

function renderStars(value){
  const rounded = Math.round(Number(value || 0));
  let stars = "";
  for(let i = 1; i <= 5; i++){
    stars += i <= rounded ? "★" : "☆";
  }
  return stars;
}

function getRatingComments(propertyId){
  const propertyRatings = ratings[propertyId] || {};
  return Object.entries(propertyRatings)
    .map(([uid,item])=>({uid,...item}))
    .sort((a,b)=>(b.createdAt || 0) - (a.createdAt || 0))
    .map(item=>`
      <div style="border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;">
        <p><b>${item.userName || item.userEmail || "User"}:</b> ${renderStars(item.rating)} ${item.comment || "No comment"}</p>
        <button class="view" onclick="editRating('${propertyId}','${item.uid}')">Edit</button>
        <button class="delete" onclick="deleteRating('${propertyId}','${item.uid}')">Delete</button>
      </div>
    `)
    .join("");
}

function render(){

  let q = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML = "";

  if(mode === "chats"){
    renderChats(q, list);
    return;
  }

  let source =
    mode==="pending" ? pending :
    mode==="approved" ? approved :
    mode==="rejected" ? rejected :
    {...pending, ...approved, ...rejected};

  for(let id in source){

    let p = source[id];

    let text =
      ((p.location||"")+" "+(p.type||"")+" "+(p.phone||"")+" "+(p.landlordEmail||"")).toLowerCase();

    if(q && !text.includes(q)) continue;

    let img = p.images?.[0] || "";
    let isPending = pending[id] ? true : false;
    let isRejected = rejected[id] ? true : false;
    let isSuspended = p.listingState === "suspended";
    let ratingSummary = getRatingSummary(id);

    list.innerHTML += `
      <div class="card">

        ${img ? `<img src="${img}">` : ""}

        <div class="cardContent">

          <b>🏠 ${p.type || "Property"}</b><br>
          📍 ${p.location || ""}<br>
          💰 KSh ${p.rent || ""}<br>
          📞 ${p.phone || ""}<br>

          <span class="badge ${isRejected ? "rejected" : isPending ? "pending" : isSuspended ? "suspended" : "approved"}">
            ${isRejected ? "Rejected" : isPending ? "Pending" : isSuspended ? "Suspended" : "Approved"}
          </span>

          <br><br>

          <div><b>Rating:</b> ${ratingSummary}</div>

          <button class="view" onclick='openDetails("${safe({id,...p})}")'>View</button>

          ${isPending ? `
            <button class="approve" onclick="approve('${id}')">✔ Approve</button>
            <button class="reject" onclick="rejectItem('${id}')">❌ Reject</button>
          ` : ""}

          ${!isPending && !isRejected ? `
            ${isSuspended ? `
              <button class="restore" onclick="restoreItem('${id}')">Restore</button>
            ` : `
              <button class="suspend" onclick="suspendItem('${id}')">Suspend</button>
            `}
          ` : ""}

          ${!isRejected ? `<button class="delete" onclick="deleteItem('${id}')">🗑 Delete</button>` : ""}

        </div>

      </div>
    `;
  }
}

/* DETAILS */
function openDetails(encoded){
  let p = JSON.parse(decodeURIComponent(encoded));
  const ratingSummary = getRatingSummary(p.id);
  const hasGps = !!(p.lat && p.lng);
  const hasPhotos = Array.isArray(p.images) && p.images.length > 0;
  const hasKenyanPhone = /^\+254\d{9}$/.test(p.phone || "");
  const hasLandlord = !!p.landlordUid;

  document.getElementById("detailsContent").innerHTML = `
    <div class="modalContent">
      <h2>${p.type || "Property"}</h2>
      ${p.images?.[0] ? `<img src="${p.images[0]}" style="width:100%;max-height:320px;object-fit:cover;border-radius:12px;">` : ""}
      <p><b>Location:</b> ${p.location || ""}</p>
      <p><b>Rent:</b> KSh ${p.rent || ""}</p>
      <p><b>Deposit:</b> KSh ${p.deposit || ""}</p>
      <p><b>Availability:</b> ${p.status || p.availability || ""}</p>
      <p><b>Rooms:</b> ${p.roomsAvailable || ""}</p>
      <p><b>Occupants:</b> ${p.gender || ""}</p>
      <p><b>Utilities:</b> ${p.utilities || ""}</p>
      ${p.includedUtilities ? `<p><b>Utilities Included In Rent:</b> ${p.includedUtilities}</p>` : ""}
      <p><b>Amenities:</b> ${p.amenities || ""}</p>
      <p><b>Rating:</b> ${ratingSummary}</p>
      <h3>Ratings & Comments</h3>
      ${getRatingComments(p.id) || "<p>No ratings yet.</p>"}
      <p><b>Description:</b> ${p.extra || ""}</p>
      <p><b>Landlord:</b> ${p.landlordEmail || "Not recorded"}</p>
      <p><b>Phone:</b> ${p.phone || ""}</p>
      <p><b>Review Status:</b> ${p.reviewStatus || ""}</p>
      ${p.rejectReason ? `<p><b>Reject Reason:</b> ${p.rejectReason}</p>` : ""}
      ${p.suspendReason ? `<p><b>Suspension Reason:</b> ${p.suspendReason}</p>` : ""}

      <h3>Trust Checks</h3>
      <div class="trustGrid">
        <div class="trustItem"><span class="${hasGps ? "trustPass" : "trustFail"}">${hasGps ? "OK" : "Missing"}</span><br>GPS location</div>
        <div class="trustItem"><span class="${hasPhotos ? "trustPass" : "trustFail"}">${hasPhotos ? "OK" : "Missing"}</span><br>Property photos</div>
        <div class="trustItem"><span class="${hasKenyanPhone ? "trustPass" : "trustFail"}">${hasKenyanPhone ? "OK" : "Check"}</span><br>Kenyan phone format</div>
        <div class="trustItem"><span class="${hasLandlord ? "trustPass" : "trustFail"}">${hasLandlord ? "OK" : "Missing"}</span><br>Landlord account</div>
      </div>

      <button class="mapbtn" onclick="openMap(${p.lat},${p.lng})">
        View Map
      </button>
    </div>
  `;

  document.getElementById("detailsModal").style.display="block";
}

function editRating(propertyId, uid){
  const item = ratings[propertyId]?.[uid];
  if(!item) return;

  const ratingValue = prompt("Edit rating from 1 to 5", item.rating || "");
  if(ratingValue === null) return;

  const rating = Number(ratingValue);
  if(!Number.isInteger(rating) || rating < 1 || rating > 5){
    alert("Please enter a whole number from 1 to 5.");
    return;
  }

  const comment = prompt("Edit comment", item.comment || "");
  if(comment === null) return;

  db.ref("ratings/" + propertyId + "/" + uid).update({
    rating,
    comment: comment.trim(),
    moderatedAt: Date.now()
  });
}

function deleteRating(propertyId, uid){
  if(!confirm("Delete this rating/comment?")) return;
  db.ref("ratings/" + propertyId + "/" + uid).remove();
}

function closeDetails(){
  document.getElementById("detailsModal").style.display="none";
}

function approve(id){

  let item = pending[id];
  if(!item) return;
  if(!confirm("Approve only after verifying photos, GPS location, phone number, and landlord identity.")) return;

  item.approved = true;
  item.reviewStatus = "approved";
  item.approvedAt = Date.now();
  item.verifiedAt = Date.now();
  item.adminVerified = true;
  item.listingState = "active";

  const targetId = item.previousPropertyId || id;

  db.ref("properties/" + targetId).set(item);
  db.ref("pendingProperties/" + id).remove();

}

function renderChats(q, list){
  const rows = Object.entries(chats)
    .map(([id, chat])=>({id, ...chat}))
    .sort((a,b)=>(b.updatedAt || 0) - (a.updatedAt || 0));

  rows.forEach(chat=>{
    const text = ((chat.propertyTitle || "") + " " + (chat.propertyLocation || "") + " " + (chat.landlordEmail || "")).toLowerCase();
    if(q && !text.includes(q)) return;

    const messages = chat.messages || {};
    const messageRows = Object.values(messages).sort((a,b)=>(a.createdAt || 0) - (b.createdAt || 0));

    list.innerHTML += `
      <div class="card">
        <div class="cardContent">
          <b>${chat.propertyTitle || "Property chat"}</b><br>
          ${chat.propertyLocation || ""}<br>
          Landlord: ${chat.landlordEmail || chat.landlordUid || ""}<br>
          Student: ${chat.userName || chat.userUid || ""}
          <div class="messages">
            ${messageRows.map(m=>`
              <div class="message">
                <b>${m.senderRole || "user"}</b>
                ${m.text || ""}
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  });

  if(!list.innerHTML){
    list.innerHTML = "<div class='card'><div class='cardContent'>No chats found.</div></div>";
  }
}

function rejectItem(id){
  const item = pending[id];
  if(!item) return;

  const reason = prompt("Why is this property rejected? This will be shown to the landlord.");
  if(reason === null) return;

  item.approved = false;
  item.reviewStatus = "rejected";
  item.rejectReason = reason.trim() || "Admin rejected this property.";
  item.rejectedAt = Date.now();

  db.ref("rejectedProperties/" + id).set(item);
  db.ref("pendingProperties/" + id).remove();
}

function deleteItem(id){
  if(!confirm("Delete this listing permanently?")) return;
  db.ref("pendingProperties/" + id).remove();
  db.ref("properties/" + id).remove();
}

function suspendItem(id){
  const reason = prompt("Why are you suspending this listing?");
  if(reason === null) return;

  db.ref("properties/" + id).update({
    listingState: "suspended",
    suspendReason: reason.trim() || "Suspended by admin.",
    suspendedAt: Date.now()
  });
}

function restoreItem(id){
  db.ref("properties/" + id).update({
    listingState: "active",
    suspendReason: null,
    restoredAt: Date.now()
  });
}

function openMap(lat,lng){
  window.open("https://www.google.com/maps?q="+lat+","+lng);
}

</script>

</body>
</html>
