<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
display:flex;
background:#f5f7fb;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#111;
color:white;
height:100vh;
padding:10px;
position:fixed;
left:0;
top:0;
}

.sidebar h2{color:white;}

.menuBtn{
width:100%;
padding:12px;
margin:6px 0;
background:#222;
border:none;
color:white;
text-align:left;
border-radius:6px;
cursor:pointer;
}

.menuBtn:hover{background:#333;}

.active{background:#2563eb !important;}

/* CONTENT */
.content{
margin-left:260px;
padding:20px;
width:100%;
}

/* CARD */
.card{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* BADGE */
.badge{
padding:4px 8px;
border-radius:6px;
color:white;
font-size:12px;
}

.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

/* IMAGES */
img{
width:70px;
height:60px;
object-fit:cover;
margin:3px;
border-radius:5px;
}

/* INPUTS */
textarea{
width:100%;
padding:6px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

/* MOBILE */
@media(max-width:768px){
.sidebar{
transform:translateX(-100%);
transition:0.3s;
position:fixed;
z-index:1000;
}

.sidebar.open{transform:translateX(0);}

.content{margin-left:0;}

.hamburger{
display:block;
background:#111;
color:white;
padding:10px;
border:none;
width:100%;
}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<h2>Admin</h2>

<button class="menuBtn" onclick="loadView('pending')">🟡 Pending</button>
<button class="menuBtn" onclick="loadView('approved')">🟢 Approved</button>
<button class="menuBtn" onclick="loadView('rejected')">🔴 Rejected</button>
<button class="menuBtn" onclick="loadView('all')">⚫ All</button>

<button class="menuBtn" onclick="logout()" style="margin-top:20px;background:red;">
Logout
</button>
</div>

<!-- CONTENT -->
<div class="content">

<button class="hamburger" onclick="toggleMenu()">☰ Menu</button>

<h2 id="title">Admin Panel</h2>
<div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentView="pending";

/* AUTH PROTECTION */
auth.onAuthStateChanged(user=>{
if(!user){
window.location.href="login.html";
}
});

/* TOGGLE */
function toggleMenu(){
sidebar.classList.toggle("open");
}

/* VIEW SWITCH */
function loadView(view){
currentView=view;

if(view==="pending") loadPending();
if(view==="approved") loadApproved();
if(view==="rejected") loadRejected();
if(view==="all") loadAll();

document.getElementById("title").innerText=view.toUpperCase()+" PROPERTIES";
}

/* LOADERS */
function loadPending(){
db.ref("pendingProperties").on("value",snap=>{
render(snap.val()||{},"pending");
});
}

function loadApproved(){
db.ref("approvedProperties").on("value",snap=>{
render(snap.val()||{},"approved");
});
}

function loadRejected(){
db.ref("rejectedProperties").on("value",snap=>{
renderRejected(snap.val()||{});
});
}

function loadAll(){
db.ref("allProperties").on("value",snap=>{
render(snap.val()||{},"all",true);
});
}

/* RENDER */
function render(data,type,isReadOnly=false){

let html="";

for(let id in data){
let p=data[id];

html+=`
<div class="card">

<span class="badge ${type}">${type}</span><br>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>
💰 ${p.rent||""}<br>
📞 ${p.phone||""}<br>

<div>
${(p.images||[]).map(i=>`<img src="${i}">`).join("")}
</div>
`;

if(type==="pending"){
html+=`
<textarea id="r_${id}" placeholder="Rejection reason"></textarea>

<button onclick="approve('${id}')">Approve</button>
<button onclick="reject('${id}')">Reject</button>
<button onclick="remove('${id}','pendingProperties')">Delete</button>
`;
}

if(type==="approved"){
html+=`
<button onclick="remove('${id}','approvedProperties')">Delete</button>
`;
}

if(type==="all"){
html+=`<small>Master record</small>`;
}

html+=`</div>`;
}

list.innerHTML=html;
}

/* REJECT VIEW */
function renderRejected(data){

let html="";

for(let id in data){
let p=data[id];

html+=`
<div class="card">

<span class="badge rejected">rejected</span><br>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>

<p><b>Reason:</b> ${p.rejectionReason||""}</p>

<div>
${(p.images||[]).map(i=>`<img src="${i}">`).join("")}
</div>

<button onclick="remove('${id}','rejectedProperties')">Delete</button>

</div>
`;
}

list.innerHTML=html;
}

/* ACTIONS */
function approve(id){

db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
data.status="approved";

db.ref("approvedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
db.ref("allProperties/"+id).set(data);
});
}

function reject(id){

let reason=document.getElementById("r_"+id).value||"";

db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
data.status="rejected";
data.rejectionReason=reason;

db.ref("rejectedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
db.ref("allProperties/"+id).set(data);
});
}

function remove(id,node){
db.ref(node+"/"+id).remove();
}

/* LOGOUT */
function logout(){
auth.signOut();
location.reload();
}

/* DEFAULT */
loadView("pending");

</script>

</body>
</html>
