<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* 🔐 LOCK SCREEN ALWAYS ACTIVE */
#lockScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999999;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
  overflow:auto;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
}

.main{
  margin-left:240px;
  padding:20px;
  display:none; /* locked */
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.statBox{
  background:white;
  padding:15px;
  border-radius:12px;
}

.card{
  background:white;
  margin-top:15px;
  border-radius:12px;
  padding:10px;
}

/* BADGES */
.pending{ background:orange; color:white; padding:5px; border-radius:6px; }
.approved{ background:green; color:white; padding:5px; border-radius:6px; }

button{
  padding:10px;
  margin:4px;
}

.approve{ background:#28a745; color:white; }
.reject{ background:#ff9800; color:white; }
.delete{ background:#e74c3c; color:white; }

</style>
</head>

<body>

<!-- 🔐 HARD LOCK SCREEN -->
<div id="lockScreen">
  <h2>🔐 Verifying Admin Access...</h2>
  <p>Please wait...</p>
</div>

<div class="sidebar">

  <h2>Admin Panel</h2>

  <button onclick="showPending()">Pending</button>
  <button onclick="showApproved()">Approved</button>
  <button onclick="loadAll()">All</button>

  <button onclick="logout()" style="background:#c62828;">Logout</button>

</div>

<div class="main">

  <h1>Dashboard</h1>

  <div class="stats">
    <div class="statBox">
      <h2 id="totalPending">0</h2>
      <p>Pending</p>
    </div>

    <div class="statBox">
      <h2 id="totalApproved">0</h2>
      <p>Approved</p>
    </div>
  </div>

  <input id="search" placeholder="Search..." oninput="render()">

  <div id="list"></div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let pending = {};
let approved = {};
let mode = "pending";

let isUnlocked = false;

/* 🔐 STEP G HARD SECURITY CORE */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const token = new URLSearchParams(window.location.search).get("token");

  if(!token){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const snap = await db.ref("adminSessions/" + user.uid).once("value");

  if(!snap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const session = snap.val();

  if(session.token !== token){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  if(Date.now() - session.createdAt > 86400000){
    await db.ref("adminSessions/" + user.uid).remove();
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* ✅ UNLOCK ONLY AFTER FULL VALIDATION */
  isUnlocked = true;

  document.getElementById("lockScreen").style.display = "none";
  document.querySelector(".main").style.display = "block";

  startDataListeners(); // IMPORTANT
});

/* 🚫 BLOCK DATA UNTIL AUTH PASSES */
function startDataListeners(){

  db.ref("pendingProperties").on("value", snap=>{
    if(!isUnlocked) return;
    pending = snap.val() || {};
    updateStats();
    render();
  });

  db.ref("properties").on("value", snap=>{
    if(!isUnlocked) return;
    approved = snap.val() || {};
    updateStats();
    render();
  });

}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>{
    window.location.href = "admin-login.html";
  });
}

function updateStats(){
  document.getElementById("totalPending").innerText = Object.keys(pending).length;
  document.getElementById("totalApproved").innerText = Object.keys(approved).length;
}

function showPending(){ mode="pending"; render(); }
function showApproved(){ mode="approved"; render(); }
function loadAll(){ mode="all"; render(); }

function render(){

  if(!isUnlocked) return;

  let q = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");

  list.innerHTML = "";

  let source =
    mode==="pending" ? pending :
    mode==="approved" ? approved :
    {...pending, ...approved};

  for(let id in source){

    let p = source[id];

    let text = ((p.location||"")+" "+(p.type||"")).toLowerCase();

    if(q && !text.includes(q)) continue;

    let isPending = pending[id];

    list.innerHTML += `
      <div class="card">
        <b>${p.type}</b><br>
        ${p.location}<br>

        <span class="${isPending ? "pending":"approved"}">
          ${isPending ? "Pending":"Approved"}
        </span>

        <br><br>

        ${isPending ? `
          <button class="approve" onclick="approve('${id}')">Approve</button>
          <button class="reject" onclick="rejectItem('${id}')">Reject</button>
        ` : ""}

        <button class="delete" onclick="deleteItem('${id}')">Delete</button>
      </div>
    `;
  }
}

function approve(id){
  let item = pending[id];
  if(!item) return;

  item.approved = true;

  db.ref("properties/" + id).set(item);
  db.ref("pendingProperties/" + id).remove();
}

function rejectItem(id){
  db.ref("pendingProperties/" + id).remove();
}

function deleteItem(id){
  db.ref("pendingProperties/" + id).remove();
  db.ref("properties/" + id).remove();
}

</script>

</body>
</html>
