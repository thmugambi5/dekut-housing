<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}

/* LOADING SCREEN */
#loadingScreen{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:99999;
}

#app{display:none;}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;top:0;
  width:220px;height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
}

/* MAIN */
.main{margin-left:240px;padding:20px;}

.card{
  background:white;
  margin-top:15px;
  border-radius:12px;
  padding:15px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.approve{background:green;color:white;}
.reject{background:orange;color:white;}
.delete{background:red;color:white;}
.view{background:#111;color:white;}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;}

.backBtn{position:fixed;top:10px;left:10px;background:black;color:white;padding:10px;}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loadingScreen">
  <h2>🔐 Checking Admin Access...</h2>
</div>

<!-- APP -->
<div id="app">

<div class="sidebar">
  <h2>Admin Panel</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">
  <h1>Dashboard</h1>
  <input id="search" oninput="render()" placeholder="Search...">
  <div id="list"></div>
</div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* ADMIN CHECK FROM DATABASE (NO HARDCODE) */
function checkAdmin(uid){

  return db.ref("admins/" + uid).get().then(snap=>{
    return snap.exists(); // true = admin
  });

}

let pending = {};
let approved = {};

/* AUTH GUARD */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const isAdmin = await checkAdmin(user.uid);

  if(!isAdmin){
    auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("app").style.display = "block";

  startRealtime();

});

/* REALTIME */
function startRealtime(){

  db.ref("pendingProperties").on("value", snap=>{
    pending = snap.val() || {};
    render();
  });

  db.ref("properties").on("value", snap=>{
    approved = snap.val() || {};
    render();
  });

}

/* RENDER */
function render(){

  let q = document.getElementById("search").value?.toLowerCase() || "";
  let list = document.getElementById("list");
  list.innerHTML = "";

  let all = {...pending, ...approved};

  for(let id in all){

    let p = all[id];

    let text = ((p.location||"")+" "+(p.type||"")).toLowerCase();

    if(q && !text.includes(q)) continue;

    let isPending = pending[id];

    list.innerHTML += `
      <div class="card">
        <b>${p.type}</b><br>
        ${p.location}<br>
        KSh ${p.rent}<br>

        <span>${isPending ? "PENDING" : "APPROVED"}</span><br><br>

        ${isPending ? `
          <button class="approve" onclick="approve('${id}')">Approve</button>
        ` : ""}

        <button class="delete" onclick="del('${id}')">Delete</button>

      </div>
    `;
  }

}

/* ACTIONS */
function approve(id){

  let item = pending[id];
  if(!item) return;

  item.approved = true;

  db.ref("properties/"+id).set(item);
  db.ref("pendingProperties/"+id).remove();

}

function del(id){
  db.ref("pendingProperties/"+id).remove();
  db.ref("properties/"+id).remove();
}

function logout(){
  auth.signOut().then(()=>{
    window.location.href="admin-login.html";
  });
}

</script>

</body>
</html>
