<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
console.log("Firebase global check:", window.firebase);
</script>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}

.topbar{
display:flex;justify-content:space-between;
background:#111;color:white;padding:12px;
}

.loginBox{
display:flex;justify-content:center;align-items:center;
height:100vh;background:#0f172a;
}

.box{
background:#fff;padding:20px;border-radius:10px;width:320px;
}

input,textarea{
width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc;
}

button{
padding:10px;border:none;border-radius:6px;background:#2563eb;color:white;cursor:pointer;
}

.card{
background:#fff;margin:10px;padding:10px;border-radius:10px;
}

.badge{padding:4px 8px;color:white;border-radius:6px;font-size:12px;}
.pending{background:orange;}
.approved{background:green;}

img{
width:80px;height:60px;object-fit:cover;margin:3px;border-radius:5px;
}

.actionBtn{
margin:3px;padding:6px 8px;border:none;border-radius:6px;color:white;cursor:pointer;
}

.approve{background:green;}
.reject{background:red;}
.edit{background:#f59e0b;}
.view{background:#2563eb;}

#editModal{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:white;padding:20px;overflow:auto;
z-index:9999;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="loginBox">
<div class="box">
<h2>Admin Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="topbar">
<div>Admin Dashboard</div>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Pending Properties</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Approved Properties</h3>
<div id="approvedList"></div>
</div>

</div>

<!-- EDIT MODAL -->
<div id="editModal">
<h2>Edit Property</h2>

<input id="editTitle">
<input id="editLocation">
<textarea id="editDesc"></textarea>

<button onclick="saveEdit()">Save Changes</button>
<button onclick="closeEdit()">Close</button>
</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGZ0Ozz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing",
storageBucket:"dekut-housing.appspot.com",
messagingSenderId:"784034754945",
appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
  console.log("STEP 1 - Firebase apps:", firebase.apps);
console.log("STEP 1 - Firebase name:", firebase.app().name);
  console.log("CONFIG CHECK:", firebase.apps.length);

const auth=firebase.auth();
const db=firebase.database();

const ADMIN_EMAIL="admin@dekut.com";

let currentEditId=null;

/* LOGIN */
async function login(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

try{
let res=await auth.signInWithEmailAndPassword(email,pass);

if(res.user.email!==ADMIN_EMAIL){
alert("Not authorized");
auth.signOut();
return;
}

document.getElementById("loginView").style.display="none";
document.getElementById("dashboard").style.display="block";

loadPending();
loadApproved();

}catch(e){
document.getElementById("msg").innerText=e.message;
}
}

/* PENDING */
function loadPending(){
db.ref("pendingProperties").on("value",snap=>{
let data=snap.val()||{};
let html="";

for(let id in data){
let p=data[id];

html+=`
<div class="card">

<div class="badge pending">Pending</div><br>

<b>${p.title||""}</b><br>
📍 ${p.location||""}<br>

<div>
${(p.images||[]).map(img=>`<img src="${img}">`).join("")}
</div>

<button class="actionBtn edit" onclick="edit('${id}','${encodeURIComponent(JSON.stringify(p))}')">Edit</button>
<button class="actionBtn approve" onclick="approve('${id}')">Approve</button>
<button class="actionBtn reject" onclick="reject('${id}')">Reject</button>

</div>
`;
}

document.getElementById("list").innerHTML=html;
});
}

/* APPROVED */
function loadApproved(){
db.ref("properties").on("value",snap=>{
let data=snap.val()||{};
let html="";

for(let id in data){
let p=data[id];

html+=`
<div class="card">

<div class="badge approved">Approved</div><br>

<b>${p.title||""}</b><br>
📍 ${p.location||""}<br>

<div>
${(p.images||[]).map(img=>`<img src="${img}">`).join("")}
</div>

<button class="actionBtn reject" onclick="deleteApproved('${id}')">Delete</button>

</div>
`;
}

document.getElementById("approvedList").innerHTML=html;
});
}

/* APPROVE */
async function approve(id){
let snap=await db.ref("pendingProperties/"+id).once("value");
if(!snap.exists()) return;

let data=snap.val();
data.status="approved";

await db.ref("properties/"+id).set(data);
await db.ref("pendingProperties/"+id).remove();

alert("Approved");
}

/* REJECT */
async function reject(id){
await db.ref("pendingProperties/"+id).remove();
}

/* DELETE APPROVED */
async function deleteApproved(id){
await db.ref("properties/"+id).remove();
}

/* EDIT */
function edit(id,data){
currentEditId=id;
let p=JSON.parse(decodeURIComponent(data));

document.getElementById("editTitle").value=p.title||"";
document.getElementById("editLocation").value=p.location||"";
document.getElementById("editDesc").value=p.description||"";

document.getElementById("editModal").style.display="block";
}

/* SAVE EDIT → BACK TO PENDING */
async function saveEdit(){

let snap=await db.ref("pendingProperties/"+currentEditId).once("value");
if(!snap.exists()) return;

let old=snap.val();

old.title=document.getElementById("editTitle").value;
old.location=document.getElementById("editLocation").value;
old.description=document.getElementById("editDesc").value;

old.status="pending";

await db.ref("pendingProperties/"+currentEditId).set(old);

closeEdit();
alert("Updated → sent back for approval");
}

/* CLOSE EDIT */
function closeEdit(){
document.getElementById("editModal").style.display="none";
}

/* LOGOUT */
function logout(){
auth.signOut();
location.reload();
}

</script>

</body>
</html>
