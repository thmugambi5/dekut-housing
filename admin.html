<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f7fb;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:#111;
color:white;
height:100vh;
padding:10px;
position:fixed;
left:0;
top:0;
transition:0.3s;
}

.sidebar h2{color:white;}

.menuBtn{
display:block;
padding:12px;
margin:8px 0;
background:#222;
border:none;
color:white;
width:100%;
text-align:left;
border-radius:6px;
cursor:pointer;
}

.menuBtn:hover{background:#333;}

.active{background:#2563eb !important;}

/* CONTENT */
.content{
margin-left:260px;
padding:20px;
width:100%;
}

/* CARDS */
.card{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
}

.badge{
padding:4px 8px;
border-radius:6px;
color:white;
font-size:12px;
}

.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

img{
width:70px;
height:60px;
object-fit:cover;
margin:3px;
border-radius:5px;
}

textarea{
width:100%;
margin-top:5px;
padding:6px;
border-radius:6px;
border:1px solid #ccc;
}

/* MOBILE */
@media(max-width:768px){
.sidebar{
transform:translateX(-100%);
position:fixed;
z-index:1000;
}

.sidebar.open{
transform:translateX(0);
}

.content{
margin-left:0;
}

.hamburger{
display:block;
background:#111;
color:white;
padding:10px;
border:none;
width:100%;
text-align:left;
}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<h2>Admin</h2>

<button class="menuBtn" onclick="loadView('pending')">🟡 Pending</button>
<button class="menuBtn" onclick="loadView('approved')">🟢 Approved</button>
<button class="menuBtn" onclick="loadView('rejected')">🔴 Rejected</button>
<button class="menuBtn" onclick="loadView('all')">⚫ All Properties</button>

<button class="menuBtn" onclick="logout()" style="margin-top:20px;background:red;">
Logout
</button>

</div>

<!-- CONTENT -->
<div class="content">

<button class="hamburger" onclick="toggleMenu()">☰ Menu</button>

<h2 id="title">Pending Properties</h2>
<div id="list"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing",
storageBucket:"dekut-housing.appspot.com",
messagingSenderId:"784034754945",
appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentView = "pending";

/* SIDEBAR TOGGLE (MOBILE) */
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
}

/* LOAD VIEW */
function loadView(view){
currentView = view;

let titleMap = {
pending:"Pending Properties",
approved:"Approved Properties",
rejected:"Rejected Properties",
all:"All Properties"
};

document.getElementById("title").innerText = titleMap[view];

if(view === "pending") loadPending();
if(view === "approved") loadApproved();
if(view === "rejected") loadRejected();
if(view === "all") loadAll();
}

/* ================= LOAD FUNCTIONS ================= */

function loadPending(){
db.ref("pendingProperties").on("value",snap=>{
renderCards(snap.val()||{}, "pending");
});
}

function loadApproved(){
db.ref("approvedProperties").on("value",snap=>{
renderCards(snap.val()||{}, "approved");
});
}

function loadRejected(){
db.ref("rejectedProperties").on("value",snap=>{
renderRejected(snap.val()||{});
});
}

function loadAll(){
db.ref("allProperties").on("value",snap=>{
renderCards(snap.val()||{}, "all", true);
});
}

/* ================= RENDER ================= */

function renderCards(data,type,isReadOnly=false){
let html="";

for(let id in data){
let p=data[id];

html += `
<div class="card">

<span class="badge ${type}">${type}</span><br>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>
💰 ${p.rent||""}<br>
📞 ${p.phone||""}<br>

<div>${(p.images||[]).map(i=>`<img src="${i}">`).join("")}</div>
`;

if(type==="pending"){
html += `
<textarea id="r_${id}" placeholder="Rejection reason..."></textarea>
<button onclick="approve('${id}')">Approve</button>
<button onclick="reject('${id}')">Reject</button>
<button onclick="remove('${id}','pending')">Delete</button>
`;
}

if(type==="approved"){
html += `<button onclick="remove('${id}','approved')">Delete</button>`;
}

if(type==="all"){
html += `<small>Master record</small>`;
}

html += `</div>`;
}

document.getElementById("list").innerHTML = html;
}

/* REJECT RENDER */
function renderRejected(data){
let html="";

for(let id in data){
let p=data[id];

html += `
<div class="card">

<span class="badge rejected">rejected</span><br>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>

<p><b>Reason:</b> ${p.rejectionReason||""}</p>

<div>${(p.images||[]).map(i=>`<img src="${i}">`).join("")}</div>

<button onclick="remove('${id}','rejected')">Delete</button>

</div>
`;
}

document.getElementById("list").innerHTML = html;
}

/* ================= ACTIONS ================= */

function approve(id){
db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
data.status="approved";

db.ref("approvedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
db.ref("allProperties/"+id).set(data);
});
}

function reject(id){
let reason=document.getElementById("r_"+id).value||"";

db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
data.status="rejected";
data.rejectionReason=reason;

db.ref("rejectedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
db.ref("allProperties/"+id).set(data);
});
}

function remove(id,node){
db.ref(node+"/"+id).remove();
}

/* AUTH SIMPLE LOGOUT */
function logout(){
firebase.auth().signOut();
location.reload();
}

/* DEFAULT */
loadView("pending");

</script>

</body>
</html>
