<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{ margin:0; font-family:Arial; background:#f4f6f9; }

#lockScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

.main{ display:none; padding:20px; }
</style>
</head>

<body>

<div id="lockScreen">
  <h2>Verifying admin access...</h2>
</div>

<div class="main">
  <h1>Admin Dashboard</h1>
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* STEP G SAFE CHECK */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const urlToken = new URLSearchParams(window.location.search).get("token");

  if(!urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* ADMIN CHECK */
  const adminSnap = await db.ref("admins/" + user.uid).once("value");

  if(!adminSnap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* SESSION CHECK */
  const sessionSnap = await db.ref("adminSessions/" + user.uid).once("value");

  if(!sessionSnap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const session = sessionSnap.val();

  if(session.token !== urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* EXPIRY CHECK (24h) */
  const expired = Date.now() - session.createdAt > 86400000;

  if(expired){
    await db.ref("adminSessions/" + user.uid).remove();
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* SUCCESS */
  document.getElementById("lockScreen").style.display = "none";
  document.querySelector(".main").style.display = "block";

});

</script>

</body>
</html>
