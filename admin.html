<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* LOADING SCREEN */
#loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#222;
  color:white;
}

.sidebar button:hover{
  background:#333;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
  display:none;
}

/* CARD */
.card{
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* BUTTONS */
button.action{
  padding:8px 10px;
  border:none;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
}

.approve{ background:green; color:white; }
.reject{ background:orange; color:white; }
.delete{ background:red; color:white; }

</style>
</head>

<body>

<div id="loading">
  <h2>🔐 Verifying Access...</h2>
  <p>Please wait...</p>
</div>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <button onclick="loadAll()">All</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">
  <h2>Dashboard</h2>
  <div id="list"></div>
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let sessionToken = null;
let currentUser = null;

/* SAFE AUTH GATE */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  currentUser = user;

  const urlToken = new URLSearchParams(window.location.search).get("token");

  if(!urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  sessionToken = urlToken;

  const snap = await db.ref("adminSessions/" + user.uid).once("value");

  if(!snap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const session = snap.val();

  // token mismatch
  if(session.token !== urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  // expiry check (24h)
  const expired = Date.now() - session.createdAt > 86400000;

  if(expired){
    await db.ref("adminSessions/" + user.uid).remove();
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  // SUCCESS → unlock UI
  document.getElementById("loading").style.display = "none";
  document.querySelector(".main").style.display = "block";

  loadAll();

});

/* LOAD DATA */
function loadAll(){

  db.ref("properties").on("value", snap => {

    const data = snap.val() || {};
    const list = document.getElementById("list");

    list.innerHTML = "";

    for(let id in data){

      const p = data[id];

      list.innerHTML += `
        <div class="card">
          <b>${p.type || ""}</b><br>
          ${p.location || ""}<br>
          KSh ${p.rent || ""}<br>

          <button class="action approve" onclick="approve('${id}')">Approve</button>
          <button class="action delete" onclick="removeItem('${id}')">Delete</button>
        </div>
      `;
    }

  });

}

/* ACTIONS */
function approve(id){
  db.ref("properties/" + id).update({ approved: true });
}

function removeItem(id){
  db.ref("properties/" + id).remove();
}

/* LOGOUT */
async function logout(){
  if(currentUser){
    await db.ref("adminSessions/" + currentUser.uid).remove();
    await auth.signOut();
  }
  window.location.href = "admin-login.html";
}

</script>

</body>
</html>
