<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

#lockScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

.main{
  display:none;
  padding:20px;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
}

.content{
  margin-left:240px;
}
</style>
</head>

<body>

<div id="lockScreen">
  <h2>Verifying admin access...</h2>
</div>

<div class="sidebar">
  <h3>Admin</h3>
</div>

<div class="main">
  <div class="content">
    <h1>Dashboard</h1>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* STEP G SAFE AUTH FLOW */
auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  const urlToken = new URLSearchParams(window.location.search).get("token");

  if(!urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* CHECK ADMIN */
  const adminSnap = await db.ref("admins/" + user.uid).once("value");

  if(!adminSnap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* CHECK SESSION */
  const sessionSnap = await db.ref("adminSessions/" + user.uid).once("value");

  if(!sessionSnap.exists()){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  const session = sessionSnap.val();

  if(!session.token || session.token !== urlToken){
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* EXPIRY CHECK (24H) */
  const expired = Date.now() - session.createdAt > 86400000;

  if(expired){
    await db.ref("adminSessions/" + user.uid).remove();
    await auth.signOut();
    window.location.href = "admin-login.html";
    return;
  }

  /* SUCCESS */
  document.getElementById("lockScreen").style.display = "none";
  document.querySelector(".main").style.display = "block";

});

</script>

</body>
</html>
