<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#222;
  color:white;
}

.sidebar button:hover{background:#333;}

.main{
  margin-left:240px;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.statBox{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card{
  background:white;
  margin:10px 0;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
  margin-right:5px;
}

.available{background:green;}
.occupied{background:red;}
.pending{background:orange;}

button{
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:4px;
}

.approve{background:#28a745;color:white;}
.reject{background:#ff9800;color:white;}
.delete{background:#e74c3c;color:white;}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🏠 Admin Panel</h2>

  <button onclick="showPending()">🟡 Pending</button>
  <button onclick="showApproved()">🟢 Approved</button>
  <button onclick="loadAll()">📦 All</button>
</div>

<div class="main">

<h1>Dashboard</h1>

<div class="stats">
  <div class="statBox">
    <h3 id="totalPending">0</h3>
    <p>Pending</p>
  </div>

  <div class="statBox">
    <h3 id="totalApproved">0</h3>
    <p>Approved</p>
  </div>
</div>

<br>

<input id="search" placeholder="Search..." oninput="render()" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;">

<div id="list"></div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let pending = {};
let approved = {};
let mode = "pending";

/* LOAD BOTH DATABASES */
db.ref("pendingProperties").on("value", snap=>{
  pending = snap.val() || {};
  updateStats();
  render();
});

db.ref("properties").on("value", snap=>{
  approved = snap.val() || {};
  updateStats();
  render();
});

/* STATS */
function updateStats(){
  document.getElementById("totalPending").innerText = Object.keys(pending).length;
  document.getElementById("totalApproved").innerText = Object.keys(approved).length;
}

/* MODE */
function showPending(){ mode="pending"; render(); }
function showApproved(){ mode="approved"; render(); }
function loadAll(){ mode="all"; render(); }

/* RENDER */
function render(){

  let q = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML = "";

  let source = {};

  if(mode === "pending") source = pending;
  else if(mode === "approved") source = approved;
  else source = {...pending, ...approved};

  for(let id in source){

    let p = source[id];

    let text = ((p.location||"")+" "+(p.type||"")+" "+(p.phone||"")).toLowerCase();

    if(q && !text.includes(q)) continue;

    let isPending = pending[id] ? true : false;

    list.innerHTML += `
      <div class="card">

        <b>🏠 ${p.type}</b><br>
        📍 ${p.location}<br>
        💰 KSh ${p.rent}<br>
        📞 ${p.phone || ""}<br>

        <span class="badge ${isPending ? "pending" : "available"}">
          ${isPending ? "Pending" : "Approved"}
        </span>

        <br><br>

        ${isPending ? `
          <button class="approve" onclick="approve('${id}')">✔ Approve</button>
          <button class="reject" onclick="rejectItem('${id}')">❌ Reject</button>
        ` : ""}

        <button class="delete" onclick="deleteItem('${id}')">🗑 Delete</button>

      </div>
    `;
  }
}

/* APPROVE → MOVE DATA */
function approve(id){

  let item = pending[id];

  if(!item) return;

  db.ref("properties/" + id).set(item);
  db.ref("pendingProperties/" + id).remove();
}

/* REJECT */
function rejectItem(id){
  db.ref("pendingProperties/" + id).remove();
}

/* DELETE */
function deleteItem(id){

  db.ref("pendingProperties/" + id).remove();
  db.ref("properties/" + id).remove();
}

</script>

</body>
</html>
