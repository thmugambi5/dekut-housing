<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar h2{
  font-size:18px;
  margin-bottom:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#222;
  color:white;
}

.sidebar button:hover{
  background:#333;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.statBox{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* SEARCH */
.searchBar input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* CARDS */
.card{
  background:white;
  margin:10px 0;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
}

.available{ background:green; }
.occupied{ background:red; }
.pending{ background:orange; }

/* BUTTONS */
.btn{
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:4px;
}

.delete{ background:#e74c3c; color:white; }
.toggle{ background:#007bff; color:white; }
.approve{ background:#28a745; color:white; }
.reject{ background:#ff9800; color:white; }

</style>
</head>

<body>

<div class="sidebar">
  <h2>🏠 Admin Panel</h2>

  <button onclick="loadAll()">📦 All Properties</button>
  <button onclick="showPending()">🟡 Pending Approval</button>
  <button onclick="filterStatus('available')">🟢 Available</button>
  <button onclick="filterStatus('occupied')">🔴 Occupied</button>
  <button onclick="loadAll()">🔄 Refresh</button>
</div>

<div class="main">

  <h1>Dashboard</h1>

  <!-- STATS -->
  <div class="stats">
    <div class="statBox">
      <h3 id="total">0</h3>
      <p>Total Houses</p>
    </div>

    <div class="statBox">
      <h3 id="available">0</h3>
      <p>Available</p>
    </div>

    <div class="statBox">
      <h3 id="pending">0</h3>
      <p>Pending Approval</p>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="searchBar">
    <input id="search" placeholder="Search..." oninput="render()">
  </div>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let data = {};
let filtered = {};
let mode = "all";

/* LOAD */
db.ref("properties").on("value", snap => {
  data = snap.val() || {};
  applyMode();
  updateStats();
});

/* STATS */
function updateStats(){

  let total = 0;
  let available = 0;
  let pending = 0;

  for(let id in data){
    total++;

    let p = data[id];

    let status = (p.status || "").toLowerCase();

    if(p.approved !== true){
      pending++;
    }

    if(status === "available") available++;
  }

  document.getElementById("total").innerText = total;
  document.getElementById("available").innerText = available;
  document.getElementById("pending").innerText = pending;
}

/* MODE HANDLING */
function applyMode(){

  filtered = {};

  for(let id in data){
    let p = data[id];

    if(mode === "pending" && p.approved === true) continue;

    if(mode === "available" && (p.status||"").toLowerCase() !== "available") continue;

    if(mode === "occupied" && (p.status||"").toLowerCase() !== "occupied") continue;

    if(mode === "pending"){
      if(p.approved === true) continue;
    }

    filtered[id] = p;
  }

  render();
}

function showPending(){
  mode = "pending";
  applyMode();
}

function filterStatus(status){
  mode = status;
  applyMode();
}

function loadAll(){
  mode = "all";
  applyMode();
}

/* RENDER */
function render(){

  let q = document.getElementById("search").value.toLowerCase();

  let list = document.getElementById("list");
  list.innerHTML = "";

  for(let id in filtered){

    let p = filtered[id];

    let text =
      (p.location + " " + p.type + " " + p.phone).toLowerCase();

    if(q && !text.includes(q)) continue;

    let statusClass =
      (p.status || "").toLowerCase() === "available"
      ? "available" : "occupied";

    let approved = p.approved === true;

    list.innerHTML += `
      <div class="card">

        <b>🏠 ${p.type}</b> - ${p.location}<br>
        💰 KSh ${p.rent}<br>
        📞 ${p.phone}<br>

        <span class="badge ${approved ? "available" : "pending"}">
          ${approved ? "Approved" : "Pending"}
        </span>

        <span class="badge ${statusClass}">
          ${p.status}
        </span>

        <br><br>

        ${!approved ? `
          <button class="approve"
          onclick="approve('${id}')">
          ✔ Approve
          </button>
        ` : ""}

        <button class="delete"
        onclick="deleteProperty('${id}')">
        Delete
        </button>

      </div>
    `;
  }
}

/* APPROVE */
function approve(id){

  db.ref("properties/" + id).update({
    approved:true
  });
}

/* DELETE */
function deleteProperty(id){

  if(confirm("Delete this property?")){
    db.ref("properties/" + id).remove();
  }
}

</script>

</body>
</html>
