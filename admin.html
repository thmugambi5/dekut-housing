<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{margin:0;font-family:Arial;background:#f4f6f9;}

#lockScreen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#111;color:white;display:flex;
  justify-content:center;align-items:center;flex-direction:column;
}

.sidebar{
  position:fixed;left:0;top:0;width:240px;height:100%;
  background:#0f172a;color:white;padding:20px;
}

.sidebar button{
  width:100%;margin:6px 0;padding:12px;
  border:none;border-radius:10px;
  background:#1e293b;color:white;
}

.main{
  margin-left:260px;padding:20px;display:none;
}

/* mobile */
@media(max-width:768px){
  .sidebar{position:relative;width:100%;}
  .main{margin-left:0;}
}

.card{background:white;margin-top:15px;padding:10px;border-radius:10px;}

</style>
</head>

<body>

<div id="lockScreen">
  <h2>🔐 Verifying Admin Access...</h2>
</div>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <button onclick="showPending()">Pending</button>
  <button onclick="showApproved()">Approved</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">
<h1>Dashboard</h1>
<div id="list"></div>
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let userGlobal = null;

/* GET URL TOKEN */
function getToken(){
  return new URLSearchParams(window.location.search).get("token");
}

/* MAIN AUTH CHECK */
auth.onAuthStateChanged(async user => {

  try {

    if (!user) {
      window.location.href = "admin-login.html";
      return;
    }

    userGlobal = user;

    const urlToken = getToken();
    if (!urlToken) {
      await auth.signOut();
      return;
    }

    /* STEP 1: CHECK ADMIN EXISTS */
    const adminSnap = await db.ref("admins/" + user.uid).once("value");

    if (!adminSnap.exists()) {
      alert("Not an admin account");
      await auth.signOut();
      return;
    }

    /* STEP 2: CHECK SESSION */
    const sessionSnap = await db.ref("adminSessions/" + user.uid).once("value");

    if (!sessionSnap.exists()) {
      alert("Session missing");
      await auth.signOut();
      return;
    }

    const session = sessionSnap.val();

    /* SAFETY CONVERSION */
    const dbToken = String(session.token || "");
    const localToken = String(urlToken || "");

    console.log("DB TOKEN:", dbToken);
    console.log("URL TOKEN:", localToken);

    if (dbToken !== localToken) {
      alert("Session expired or invalid login");
      await auth.signOut();
      return;
    }

    /* STEP 3: EXPIRY CHECK */
    const SESSION_LIMIT = 24 * 60 * 60 * 1000;

    if (Date.now() - session.createdAt > SESSION_LIMIT) {
      await db.ref("adminSessions/" + user.uid).remove();
      await auth.signOut();
      window.location.href = "admin-login.html";
      return;
    }

    /* SUCCESS */
    document.getElementById("lockScreen").style.display = "none";
    document.querySelector(".main").style.display = "block";

  } catch (err) {
    console.error(err);
    await auth.signOut();
    window.location.href = "admin-login.html";
  }
});
</script>

</body>
</html>
