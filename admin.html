<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}

.topbar{
display:flex;justify-content:space-between;
background:#111;color:white;padding:12px;
}

.loginBox{
display:flex;justify-content:center;align-items:center;
height:100vh;background:#0f172a;
}

.box{
background:#fff;padding:20px;border-radius:10px;width:320px;
}

input,textarea{
width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #ccc;
}

button{
padding:10px;border:none;border-radius:6px;background:#2563eb;color:white;cursor:pointer;
margin-top:5px;
}

.card{
background:#fff;margin:10px;padding:10px;border-radius:10px;
}

.badge{
padding:4px 8px;border-radius:6px;color:white;font-size:12px;
}

.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

img{
width:80px;height:60px;object-fit:cover;margin:3px;border-radius:5px;
}

.sectionTitle{
margin:10px;
font-weight:bold;
}

textarea.rejectBox{
height:60px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="loginBox">
<div class="box">
<h2>Admin Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="topbar">
<div>Admin Dashboard</div>
<button onclick="logout()">Logout</button>
</div>

<div class="sectionTitle">🟡 Pending Properties</div>
<div id="pendingList"></div>

<div class="sectionTitle">🟢 Approved Properties</div>
<div id="approvedList"></div>

<div class="sectionTitle">🔴 Rejected Properties</div>
<div id="rejectedList"></div>

</div>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing",
storageBucket:"dekut-housing.appspot.com",
messagingSenderId:"784034754945",
appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "admin@dekut.com";

/* ================= LOGIN ================= */
function login(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email, pass)
.then(res=>{
if(res.user.email !== ADMIN_EMAIL){
alert("Not authorized");
auth.signOut();
return;
}

document.getElementById("loginView").style.display="none";
document.getElementById("dashboard").style.display="block";

loadAll();
})
.catch(e=>{
document.getElementById("msg").innerText = e.message;
});
}

/* ================= LOAD ALL ================= */
function loadAll(){
loadPending();
loadApproved();
loadRejected();
}

/* ================= PENDING ================= */
function loadPending(){
db.ref("pendingProperties").on("value",snap=>{
let data = snap.val() || {};
let html = "";

for(let id in data){
let p = data[id];

html += `
<div class="card">
<span class="badge pending">Pending</span><br>

<b>${p.type || ""}</b><br>
📍 ${p.location || ""}<br>
💰 ${p.rent || ""}<br>
📞 ${p.phone || ""}<br>

<div>${(p.images||[]).map(img=>`<img src="${img}">`).join("")}</div>

<textarea class="rejectBox" id="r_${id}" placeholder="Rejection reason..."></textarea>

<button onclick="approve('${id}')">Approve</button>
<button onclick="reject('${id}')">Reject</button>
<button onclick="deletePending('${id}')">Delete</button>
</div>
`;
}

document.getElementById("pendingList").innerHTML = html;
});
}

/* ================= APPROVED ================= */
function loadApproved(){
db.ref("approvedProperties").on("value",snap=>{
let data = snap.val() || {};
let html = "";

for(let id in data){
let p = data[id];

html += `
<div class="card">
<span class="badge approved">Approved</span><br>

<b>${p.type || ""}</b><br>
📍 ${p.location || ""}<br>
💰 ${p.rent || ""}<br>

<div>${(p.images||[]).map(img=>`<img src="${img}">`).join("")}</div>

<button onclick="deleteApproved('${id}')">Delete</button>
</div>
`;
}

document.getElementById("approvedList").innerHTML = html;
});
}

/* ================= REJECTED ================= */
function loadRejected(){
db.ref("rejectedProperties").on("value",snap=>{
let data = snap.val() || {};
let html = "";

for(let id in data){
let p = data[id];

html += `
<div class="card">
<span class="badge rejected">Rejected</span><br>

<b>${p.type || ""}</b><br>
📍 ${p.location || ""}<br>
💰 ${p.rent || ""}<br>

<p><b>Reason:</b> ${p.rejectionReason || "No reason"}</p>

<div>${(p.images||[]).map(img=>`<img src="${img}">`).join("")}</div>

<button onclick="deleteRejected('${id}')">Delete</button>
</div>
`;
}

document.getElementById("rejectedList").innerHTML = html;
});
}

/* ================= APPROVE ================= */
function approve(id){
db.ref("pendingProperties/"+id).once("value").then(snap=>{
if(!snap.exists()) return;

let data = snap.val();
data.status = "approved";

db.ref("approvedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
});
}

/* ================= REJECT ================= */
function reject(id){
let reason = document.getElementById("r_"+id).value || "";

db.ref("pendingProperties/"+id).once("value").then(snap=>{
if(!snap.exists()) return;

let data = snap.val();
data.status = "rejected";
data.rejectionReason = reason;

db.ref("rejectedProperties/"+id).set(data);
db.ref("pendingProperties/"+id).remove();
});
}

/* ================= DELETE ================= */
function deletePending(id){
db.ref("pendingProperties/"+id).remove();
}

function deleteApproved(id){
db.ref("approvedProperties/"+id).remove();
}

function deleteRejected(id){
db.ref("rejectedProperties/"+id).remove();
}

/* ================= LOGOUT ================= */
function logout(){
auth.signOut();
location.reload();
}

</script>

</body>
</html>
