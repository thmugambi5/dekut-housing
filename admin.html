<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}

/* LOGIN */
.loginBox{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#0f172a;
}

.box{
width:340px;
background:white;
padding:20px;
border-radius:12px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.msg{text-align:center;font-size:13px;margin-top:10px}

/* DASHBOARD */
.topbar{
display:flex;justify-content:space-between;
align-items:center;background:#111;color:white;
padding:12px;
}

.sidebar{
position:fixed;left:0;top:0;width:220px;height:100%;
background:#111;color:white;padding:20px;
transform:translateX(-100%);transition:.3s;
}

.sidebar.show{transform:translateX(0);}

.sidebar button{
width:100%;padding:12px;margin:6px 0;
background:#222;color:white;border:none;border-radius:8px;
}

.main{padding:15px;}

.card{
background:white;padding:15px;margin:10px 0;
border-radius:12px;
}

.badge{padding:4px 8px;border-radius:6px;color:white;font-size:12px;}
.pending{background:orange;}
.approved{background:green;}

.action{
padding:8px 10px;margin:3px;border:none;border-radius:6px;
cursor:pointer;
}
.view{background:#2563eb;color:white;}
.approve{background:green;color:white;}
.delete{background:red;color:white;}

#detailsModal{
display:none;position:fixed;top:0;left:0;
width:100%;height:100%;background:rgba(0,0,0,0.7);
}

.detailsContent{
background:white;max-width:700px;margin:40px auto;
padding:20px;border-radius:10px;
}

#loading{
display:none;
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0f172a;color:white;
justify-content:center;align-items:center;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading"><h2>Loading...</h2></div>

<!-- LOGIN -->
<div id="loginView" class="loginBox">
<div class="box">
<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
<div class="msg" id="msg"></div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="topbar">
<button onclick="toggleMenu()">☰</button>
<div>Admin Dashboard</div>
<button onclick="logout()">Logout</button>
</div>

<div class="sidebar" id="sidebar">
<h3>Menu</h3>
<button onclick="loadPending()">Pending</button>
<button onclick="loadApproved()">Approved</button>
</div>

<div class="main">
<h2 id="title">Pending Properties</h2>
<div id="list"></div>
</div>

</div>

<!-- DETAILS -->
<div id="detailsModal">
<div class="detailsContent" id="detailsContent"></div>
</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
});

const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "admin@dekut.com";

let currentUser=null;

/* DEVICE */
function getDeviceId(){
let id=localStorage.getItem("device_id");
if(!id){
id="dev_"+crypto.randomUUID();
localStorage.setItem("device_id",id);
}
return id;
}

/* LOGIN */
async function login(){

const email=document.getElementById("email").value;
const pass=document.getElementById("password").value;

const msg=document.getElementById("msg");
msg.innerText="Logging in...";

try{

const res=await auth.signInWithEmailAndPassword(email,pass);
const user=res.user;

if(user.email!==ADMIN_EMAIL){
await auth.signOut();
msg.innerText="Not authorized";
return;
}

const token="t_"+crypto.randomUUID();

await db.ref("adminSessions/"+user.uid).set({
token,
createdAt:Date.now(),
device:getDeviceId()
});

startSession(user, token);

}catch(e){
msg.innerText=e.message;
}

}

/* SESSION START */
function startSession(user, token){

currentUser=user;

document.getElementById("loginView").style.display="none";
document.getElementById("dashboard").style.display="block";

loadPending();

}

/* CHECK SESSION ON RELOAD */
auth.onAuthStateChanged(async user=>{

if(!user){
return;
}

const snap=await db.ref("adminSessions/"+user.uid).once("value");

if(!snap.exists()){
return;
}

currentUser=user;

document.getElementById("loginView").style.display="none";
document.getElementById("dashboard").style.display="block";

loadPending();

});

/* MENU */
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("show");
}

/* LOAD PENDING */
function loadPending(){

document.getElementById("title").innerText="Pending";

db.ref("pendingProperties").on("value",snap=>{

const data=snap.val()||{};
const list=document.getElementById("list");
list.innerHTML="";

for(let id in data){

const p=data[id];

list.innerHTML+=`
<div class="card">

<div class="badge pending">Pending</div>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>
💰 ${p.rent||""}<br>

<button class="action view" onclick="view('${id}','pending')">View</button>
<button class="action approve" onclick="approve('${id}')">Approve</button>
<button class="action delete" onclick="reject('${id}')">Reject</button>

</div>`;
}

});
}

/* LOAD APPROVED */
function loadApproved(){

document.getElementById("title").innerText="Approved";

db.ref("properties").on("value",snap=>{

const data=snap.val()||{};
const list=document.getElementById("list");
list.innerHTML="";

for(let id in data){

const p=data[id];

list.innerHTML+=`
<div class="card">

<div class="badge approved">Approved</div>

<b>${p.type||""}</b><br>
📍 ${p.location||""}<br>

<button class="action view" onclick="view('${id}','approved')">View</button>
<button class="action delete" onclick="del('${id}')">Delete</button>

</div>`;
}

});
}

/* APPROVE */
async function approve(id){

const snap=await db.ref("pendingProperties/"+id).once("value");
if(!snap.exists()) return;

const p=snap.val();
p.status="approved";
p.approved=true;

await db.ref("properties/"+id).set(p);
await db.ref("pendingProperties/"+id).remove();

}

/* REJECT */
async function reject(id){
await db.ref("pendingProperties/"+id).remove();
}

/* DELETE */
async function del(id){
await db.ref("properties/"+id).remove();
}

/* VIEW */
async function view(id,type){

const path=type==="pending"
?"pendingProperties/"+id
:"properties/"+id;

const snap=await db.ref(path).once("value");
const p=snap.val();

document.getElementById("detailsContent").innerHTML=`
<h2>${p.type}</h2>
<p>${p.location}</p>
<p>${p.rent}</p>
<button onclick="closeModal()">Close</button>
`;

document.getElementById("detailsModal").style.display="block";
}

function closeModal(){
document.getElementById("detailsModal").style.display="none";
}

/* LOGOUT */
async function logout(){

if(currentUser){
await db.ref("adminSessions/"+currentUser.uid).remove();
await auth.signOut();
}

location.reload();

}

</script>

</body>
</html>
