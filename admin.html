<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#222;
  color:white;
}

.sidebar button:hover{ background:#333; }

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* CARDS */
.card{
  background:white;
  margin:10px 0;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
}

.available{ background:green; }
.occupied{ background:red; }
.pending{ background:orange; }

/* BUTTONS */
.btn{
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin:4px;
}

.approve{ background:green; color:white; }
.reject{ background:red; color:white; }
.delete{ background:#e74c3c; color:white; }

</style>
</head>

<body>

<div class="sidebar">
  <h2>🏠 Admin Panel</h2>

  <button onclick="loadApproved()">📦 Approved</button>
  <button onclick="loadPending()">⏳ Pending Approval</button>
  <button onclick="loadApproved()">🔄 Refresh</button>
</div>

<div class="main">

<h1>Dashboard</h1>

<div id="list"></div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentMode = "approved";
let data = {};

/* LOAD APPROVED */
function loadApproved(){
  currentMode = "approved";
  db.ref("properties").on("value",snap=>{
    data = snap.val() || {};
    render();
  });
}

/* LOAD PENDING */
function loadPending(){
  currentMode = "pending";
  db.ref("pendingProperties").on("value",snap=>{
    data = snap.val() || {};
    render();
  });
}

/* RENDER */
function render(){

  let list = document.getElementById("list");
  list.innerHTML = "";

  for(let id in data){

    let p = data[id];

    let badgeClass =
      currentMode === "pending"
      ? "pending"
      : (p.status?.toLowerCase()==="available"?"available":"occupied");

    list.innerHTML += `
      <div class="card">

        <b>🏠 ${p.type}</b><br>
        📍 ${p.location}<br>
        💰 KSh ${p.rent}<br>
        📞 ${p.phone}<br>

        <span class="badge ${badgeClass}">
          ${currentMode==="pending" ? "Pending" : p.status}
        </span>

        <br><br>

        ${currentMode==="pending" ? `
          <button class="approve"
          onclick="approve('${id}')">
          Approve
          </button>

          <button class="reject"
          onclick="reject('${id}')">
          Reject
          </button>
        ` : `
          <button class="delete"
          onclick="deleteProperty('${id}')">
          Delete
          </button>
        `}

      </div>
    `;
  }
}

/* APPROVE */
function approve(id){

  let item = data[id];

  db.ref("properties").push(item);
  db.ref("pendingProperties/"+id).remove();

  alert("Approved ✔");
}

/* REJECT */
function reject(id){
  db.ref("pendingProperties/"+id).remove();
}

/* DELETE APPROVED */
function deleteProperty(id){
  db.ref("properties/"+id).remove();
}

loadApproved();

</script>

</body>
</html>
