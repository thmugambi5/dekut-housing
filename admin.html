<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Phase 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;display:flex;background:#f5f6fb;}

.sidebar{
width:240px;
background:#111;
color:white;
height:100vh;
padding:10px;
position:fixed;
}

.menuBtn{
width:100%;
padding:12px;
margin:6px 0;
background:#222;
border:none;
color:white;
text-align:left;
border-radius:6px;
cursor:pointer;
}

.menuBtn:hover{background:#333;}

.content{
margin-left:260px;
padding:20px;
width:100%;
}

.card{
background:white;
padding:15px;
margin:10px 0;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.badge{
padding:4px 8px;
border-radius:6px;
color:white;
font-size:12px;
}

.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}

button{
padding:8px;
margin-top:6px;
width:100%;
border:none;
border-radius:6px;
cursor:pointer;
}

.approve{background:green;color:white;}
.reject{background:orange;color:white;}
.delete{background:red;color:white;}

textarea{
width:100%;
padding:6px;
margin-top:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="card" style="margin:auto;max-width:350px;">
<h2>Admin Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err" style="color:red;"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="sidebar">
<h2>Admin</h2>

<button class="menuBtn" onclick="loadView('pending')">🟡 Pending</button>
<button class="menuBtn" onclick="loadView('approved')">🟢 Approved</button>
<button class="menuBtn" onclick="loadView('rejected')">🔴 Rejected</button>
<button class="menuBtn" onclick="loadView('all')">⚫ All</button>

<button class="menuBtn" onclick="logout()" style="margin-top:20px;background:red;">Logout</button>
</div>

<div class="content">
<h2 id="title">Admin Panel</h2>
<div id="list"></div>
</div>

</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
authDomain:"dekut-housing.firebaseapp.com",
databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
projectId:"dekut-housing"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentRef = null;

/* LOGIN */
function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.catch(e=>err.innerText=e.message);
}

/* AUTH */
auth.onAuthStateChanged(user=>{
if(user && user.email==="admin@dekut.com"){
loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");
loadView("pending");
}else{
loginBox.classList.remove("hidden");
dashboard.classList.add("hidden");
}
});

/* VIEW SWITCH */
function loadView(view){

document.getElementById("title").innerText=view.toUpperCase();

if(currentRef) currentRef.off();
currentRef=null;

/* ALL VIEW (LIVE MERGE) */
if(view==="all"){
Promise.all([
db.ref("pendingProperties").once("value"),
db.ref("approvedProperties").once("value"),
db.ref("rejectedProperties").once("value")
]).then(([p,a,r])=>{

let merged = {
...(p.val()||{}),
...(a.val()||{}),
...(r.val()||{})
};

render(merged);
});
return;
}

/* SINGLE NODE */
currentRef=db.ref(view+"Properties");

currentRef.on("value",snap=>{
render(snap.val()||{});
});
}

/* RENDER */
function render(data){

let html="";

for(let id in data){
let p=data[id];
if(!p) continue;

html+=`
<div class="card">

<h3>${p.name || p.propertyName}</h3>

<span class="badge ${p.status}">
${p.status}
</span>

<p>📍 ${p.location || ""}</p>
<p>💰 ${p.rent || ""}</p>
<p>📞 ${p.phone || ""}</p>

`;

if(p.status==="pending"){
html+=`
<textarea id="r_${id}" placeholder="Rejection reason"></textarea>
<button class="approve" onclick="approve('${id}')">Approve</button>
<button class="reject" onclick="reject('${id}')">Reject</button>
`;
}

html+=`
<button class="delete" onclick="remove('${id}')">DELETE</button>

</div>
`;
}

list.innerHTML=html;
}

/* APPROVE (MOVE) */
function approve(id){

db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
if(!data) return;

data.status="approved";
data.updatedAt=Date.now();

let updates={};
updates["approvedProperties/"+id]=data;
updates["pendingProperties/"+id]=null;

db.ref().update(updates);
});
}

/* REJECT (MOVE) */
function reject(id){

let reason=document.getElementById("r_"+id).value||"";

db.ref("pendingProperties/"+id).once("value").then(s=>{
let data=s.val();
if(!data) return;

data.status="rejected";
data.rejectionReason=reason;
data.updatedAt=Date.now();

let updates={};
updates["rejectedProperties/"+id]=data;
updates["pendingProperties/"+id]=null;

db.ref().update(updates);
});
}

/* HARD DELETE (ALL NODES) */
function remove(id){

db.ref("pendingProperties/"+id).remove();
db.ref("approvedProperties/"+id).remove();
db.ref("rejectedProperties/"+id).remove();

}

/* LOGOUT */
function logout(){
auth.signOut();
location.reload();
}

</script>

</body>
</html>
