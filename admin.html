<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* HARD LOCK SCREEN */
#lockScreen{
  position:fixed;
  inset:0;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999999;
}

/* HIDE EVERYTHING UNTIL VERIFIED */
#app{
  display:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  margin-top:15px;
  padding:15px;
  border-radius:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOCK SCREEN (DEFAULT) -->
<div id="lockScreen">
  <h2>🔐 Verifying Secure Access...</h2>
  <p>Please wait</p>
</div>

<!-- APP (HIDDEN UNTIL VERIFIED) -->
<div id="app">

  <div class="sidebar">
    <h2>Admin Panel</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main">
    <h1>Dashboard</h1>
    <div id="list"></div>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let SESSION_OK = false;

/* =========================
   STEP H SECURITY CORE
========================= */
auth.onAuthStateChanged(async user => {

  if(!user){
    forceLogout();
    return;
  }

  const token =
    new URLSearchParams(window.location.search).get("token");

  if(!token){
    forceLogout();
    return;
  }

  const snap =
    await db.ref("adminSessions/" + user.uid).once("value");

  if(!snap.exists()){
    forceLogout();
    return;
  }

  const session = snap.val();

  if(session.token !== token){
    forceLogout();
    return;
  }

  if(Date.now() - session.createdAt > 86400000){
    await db.ref("adminSessions/" + user.uid).remove();
    forceLogout();
    return;
  }

  /* ✅ VERIFIED */
  SESSION_OK = true;

  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("app").style.display = "block";

  startSessionMonitor(user.uid, token);
});

/* =========================
   🔥 LIVE SESSION MONITOR
   (STEP H UPGRADE)
========================= */
function startSessionMonitor(uid, token){

  setInterval(async ()=>{

    const snap =
      await db.ref("adminSessions/" + uid).once("value");

    if(!snap.exists()){
      forceLogout();
      return;
    }

    const session = snap.val();

    if(session.token !== token){
      forceLogout();
      return;
    }

  }, 5000); // every 5 seconds
}

/* =========================
   FORCE LOGOUT
========================= */
function forceLogout(){

  SESSION_OK = false;

  auth.signOut().then(()=>{

    window.location.href = "admin-login.html";

  }).catch(()=>{

    window.location.href = "admin-login.html";

  });
}

/* =========================
   LOGOUT BUTTON
========================= */
function logout(){

  const user = auth.currentUser;

  if(user){
    db.ref("adminSessions/" + user.uid).remove();
  }

  forceLogout();
}

/* =========================
   OPTIONAL SAFE DATA LOAD
========================= */
db.ref("pendingProperties").on("value", snap=>{

  if(!SESSION_OK) return;

  const data = snap.val() || {};

  document.getElementById("list").innerHTML =
    "<pre>"+JSON.stringify(data,null,2)+"</pre>";

});

</script>

</body>
</html>
