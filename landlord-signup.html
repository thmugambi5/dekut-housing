<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Signup - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  font-family:Arial, sans-serif;
  background:#eef2f6;
}
.box{
  width:100%;
  max-width:380px;
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(15,23,42,0.12);
}
h1{font-size:24px;margin:0 0 6px;text-align:center}
p{color:#5b6472;text-align:center;line-height:1.5}
label{display:block;margin-top:14px;font-weight:bold}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}
button{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{background:#94a3b8;cursor:not-allowed}
.link{display:block;margin-top:14px;text-align:center;color:#0f5fd7;text-decoration:none}
.msg{margin-top:12px;text-align:center;font-size:14px}
.error{color:#b91c1c}
.success{color:#166534}
</style>
</head>
<body>

<div class="box">
  <h1>Landlord Signup</h1>
  <p>Create an account before uploading houses for admin approval.</p>

  <label>Name</label>
  <input id="name" placeholder="Your full name">

  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com">

  <label>National ID Number</label>
  <input id="nationalId" inputmode="numeric" placeholder="Kenyan national ID">

  <label>Password</label>
  <input id="password" type="password" placeholder="At least 6 characters">

  <button id="signupBtn" onclick="signup()">Create Account</button>
  <a class="link" href="landlord-login.html">Already have an account? Login</a>
  <div id="msg" class="msg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* INPUT VALIDATION AND SANITIZATION */
function sanitizeInput(input) {
  if (typeof input !== 'string') return input;
  return input
    .replace(/[<>]/g, '')
    .replace(/javascript:/gi, '')
    .replace(/on\w+=/gi, '')
    .trim();
}

function validateText(value, minLength, maxLength, fieldName) {
  const text = sanitizeInput(value);
  if (minLength && text.length < minLength) return { valid: false, error: `${fieldName} must be at least ${minLength} characters` };
  if (maxLength && text.length > maxLength) return { valid: false, error: `${fieldName} must be at most ${maxLength} characters` };
  return { valid: true, value: text };
}

function validateEmail(email) {
  const sanitized = sanitizeInput(email);
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(sanitized)) return { valid: false, error: 'Please enter a valid email address' };
  return { valid: true, value: sanitized };
}

function validatePassword(password) {
  if (password.length < 6) return { valid: false, error: 'Password must be at least 6 characters' };
  if (password.length > 128) return { valid: false, error: 'Password must be at most 128 characters' };
  return { valid: true, value: password };
}

function validateNationalId(nationalId) {
  const sanitized = sanitizeInput(nationalId);
  const idRegex = /^\d{6,10}$/;
  if (!idRegex.test(sanitized)) return { valid: false, error: 'Please enter a valid national ID number (6-10 digits)' };
  return { valid: true, value: sanitized };
}

async function signup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const nationalId = document.getElementById("nationalId").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("signupBtn");

  // Validate inputs
  const nameValidation = validateText(name, 2, 50, "Name");
  if (!nameValidation.valid) {
    msg.innerHTML = "<span class='error'>" + nameValidation.error + "</span>";
    return;
  }

  const emailValidation = validateEmail(email);
  if (!emailValidation.valid) {
    msg.innerHTML = "<span class='error'>" + emailValidation.error + "</span>";
    return;
  }

  const nationalIdValidation = validateNationalId(nationalId);
  if (!nationalIdValidation.valid) {
    msg.innerHTML = "<span class='error'>" + nationalIdValidation.error + "</span>";
    return;
  }

  const passwordValidation = validatePassword(password);
  if (!passwordValidation.valid) {
    msg.innerHTML = "<span class='error'>" + passwordValidation.error + "</span>";
    return;
  }

  // Use sanitized values
  const sanitizedName = nameValidation.value;
  const sanitizedEmail = emailValidation.value;
  const sanitizedNationalId = nationalIdValidation.value;

  btn.disabled = true;
  btn.innerText = "Creating account...";

  try{
    const credential = await auth.createUserWithEmailAndPassword(sanitizedEmail, password);
    await db.collection("landlords").doc(credential.user.uid).set({
      name: sanitizedName,
      email: sanitizedEmail,
      nationalId: sanitizedNationalId,
      idVerified: false,
      createdAt: Date.now()
    });
    msg.innerHTML = "<span class='success'>Account created. Opening dashboard...</span>";
    setTimeout(()=> window.location.href = "landlord-dashboard.html", 700);
  }
  catch(error){
    msg.innerHTML = "<span class='error'>" + error.message + "</span>";
    btn.disabled = false;
    btn.innerText = "Create Account";
  }
}
</script>
</body>
</html>
