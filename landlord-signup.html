<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landlord Signup - DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  font-family:Arial, sans-serif;
  background:#eef2f6;
}
.box{
  width:100%;
  max-width:380px;
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(15,23,42,0.12);
}
h1{font-size:24px;margin:0 0 6px;text-align:center}
p{color:#5b6472;text-align:center;line-height:1.5}
label{display:block;margin-top:14px;font-weight:bold}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}
button{
  width:100%;
  margin-top:18px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{background:#94a3b8;cursor:not-allowed}
.link{display:block;margin-top:14px;text-align:center;color:#0f5fd7;text-decoration:none}
.msg{margin-top:12px;text-align:center;font-size:14px}
.error{color:#b91c1c}
.success{color:#166534}
</style>
</head>
<body>

<div class="box">
  <h1>Landlord Signup</h1>
  <p>Create an account before uploading houses for admin approval.</p>

  <label>Name</label>
  <input id="name" placeholder="Your full name">

  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com">

  <label>National ID Number</label>
  <input id="nationalId" inputmode="numeric" placeholder="Kenyan national ID">

  <label>Password</label>
  <input id="password" type="password" placeholder="At least 6 characters">

  <button id="signupBtn" onclick="signup()">Create Account</button>
  <a class="link" href="landlord-login.html">Already have an account? Login</a>
  <div id="msg" class="msg"></div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

async function signup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const nationalId = document.getElementById("nationalId").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("signupBtn");

  if(!name || !email || !nationalId || !password){
    msg.innerHTML = "<span class='error'>Please fill in all fields.</span>";
    return;
  }

  if(!/^\d{6,10}$/.test(nationalId)){
    msg.innerHTML = "<span class='error'>Please enter a valid national ID number.</span>";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Creating account...";

  try{
    const credential = await auth.createUserWithEmailAndPassword(email, password);
    await db.ref("landlords/" + credential.user.uid).set({
      name,
      email,
      nationalId,
      idVerified: false,
      createdAt: Date.now()
    });
    msg.innerHTML = "<span class='success'>Account created. Opening dashboard...</span>";
    setTimeout(()=> window.location.href = "landlord-dashboard.html", 700);
  }
  catch(error){
    msg.innerHTML = "<span class='error'>" + error.message + "</span>";
    btn.disabled = false;
    btn.innerText = "Create Account";
  }
}
</script>
</body>
</html>
