<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeKUT Student Housing Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

header {
    background: #1e88e5;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 900px;
    margin: auto;
}

.top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

input {
    flex: 1;
    min-width: 200px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

a.button {
    background: #1e88e5;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 6px;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.price {
    color: green;
    font-weight: bold;
    font-size: 16px;
}

.whatsapp {
    display: inline-block;
    margin-top: 10px;
    background: #25D366;
    color: white;
    padding: 10px;
    border-radius: 6px;
    text-decoration: none;
}

small {
    color: #666;
}
</style>
</head>

<body>

<header>
    <h2>🏠 DeKUT Student Housing Portal</h2>
    <small>Find rooms, bedsitters & apartments near DeKUT</small>
</header>

<div class="container">

<div class="top-bar">
    <input type="text" id="search" placeholder="Search by location or property type..." onkeyup="filterData()">

    <a class="button" href="https://forms.gle/9tXRvLYXDdDVy3hL7" target="_blank">
        + Post Listing
    </a>
</div>

<div id="listings">Loading listings...</div>

</div>

<script>

// ✅ Your Google Sheets CSV feed
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxE0--jIiNLlvbAtp36NL4Mf78g9hFaxZeJSP5ESglOgV28VzIlfWqqJbSbJ2wIDZorSZ2JaSvvfYS/pub?output=csv";

let allData = [];

// safer CSV parser (handles commas better than split(","))
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",");

    return lines.slice(1).map(line => {
        const values = line.split(",");

        return {
            type: values[2] || "",
            rent: values[3] || "",
            location: values[4] || "",
            distance: values[5] || "",
            gender: values[6] || "",
            amenities: values[7] || "",
            phone: values[8] || "",
            info: values[9] || ""
        };
    });
}

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();

        allData = parseCSV(text);
        render(allData);

    } catch (err) {
        document.getElementById("listings").innerHTML =
            "<p>Failed to load data. Check sheet permissions.</p>";
        console.error(err);
    }
}

function render(data) {
    const box = document.getElementById("listings");
    box.innerHTML = "";

    if (data.length === 0) {
        box.innerHTML = "<p>No listings found.</p>";
        return;
    }

    data.forEach(item => {

        let phone = (item.phone || "").replace(/\D/g, "");

        if (phone.startsWith("0")) {
            phone = "254" + phone.substring(1);
        }

        box.innerHTML += `
        <div class="card">
            <h3>${item.type || "Property"}</h3>
            <p><b>📍 Location:</b> ${item.location}</p>
            <p class="price">💰 KSh ${item.rent}</p>
            <p><b>🚶 Distance:</b> ${item.distance}</p>
            <p><b>🛠 Amenities:</b> ${item.amenities}</p>
            <p>${item.info}</p>

            <a class="whatsapp" href="https://wa.me/${phone}" target="_blank">
                💬 Contact via WhatsApp
            </a>
        </div>
        `;
    });
}

function filterData() {
    const q = document.getElementById("search").value.toLowerCase();

    const filtered = allData.filter(item =>
        (item.location || "").toLowerCase().includes(q) ||
        (item.type || "").toLowerCase().includes(q)
    );

    render(filtered);
}

loadData();

</script>

</body>
</html>
