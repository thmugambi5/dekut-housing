<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#f7f7f7;margin:0;}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px;}
img{width:100%;border-radius:10px;margin-top:5px;}
</style>
</head>

<body>

<h2 style="text-align:center;">DeKUT Housing</h2>
<div id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("properties").on("value", snap=>{
  let data = snap.val();
  let html = "";

  for(let id in data){
    let p = data[id];

    let imgs = "";
    if(p.images){
      p.images.forEach(img=>{
        imgs += `<img src="${img}">`;
      });
    }

    html += `
      <div class="card">
        <b>${p.type}</b><br>
        KSh ${p.rent}<br>
        ${p.location}<br>
        ${p.distance} KM<br>
        ${imgs}
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
});

</script>

</body>
</html>
