<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- CLUSTER CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- CLUSTER JS -->
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f6f6f6;
}

header{
  padding:14px;
  background:#fff;
  text-align:center;
  font-weight:bold;
  font-size:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* FILTERS */
.filters{
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.filters input,
.filters select{
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  width:160px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.cardContent{
  padding:12px;
  line-height:1.6;
}

button{
  margin:4px;
  padding:8px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.whatsapp{
  background:#25D366;
  color:#fff;
}

.call{
  background:#ff9800;
  color:#fff;
}

.mapbtn{
  background:#007bff;
  color:#fff;
}

.photos{
  background:#333;
  color:#fff;
}

.savebtn{
  background:#e91e63;
  color:white;
}

.modal,.photoModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:9999;
}

.photoModal img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.backBtn{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:8px 12px;
  border-radius:8px;
  z-index:99999;
  font-weight:bold;
}

/* BADGES */
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
  margin-top:4px;
}

.available{
  background:green;
}

.occupied{
  background:red;
}
</style>
</head>

<body>

<header>🏠 DeKUT Housing</header>

<!-- VIEW ALL HOUSES -->
<div style="text-align:center;padding:10px;">
  <button class="mapbtn" onclick="openAllHousesMap()">
    🗺 View All Houses on Map
  </button>
</div>

<!-- FILTERS -->
<div class="filters">

  <input id="searchBox"
  placeholder="Search (wifi, Bomas, bedsitter...)"
  oninput="applyFilters()">

  <input id="minRent"
  type="number"
  placeholder="Min Rent">

  <input id="maxRent"
  type="number"
  placeholder="Max Rent">

  <input id="maxDist"
  type="number"
  placeholder="Max Distance (km)">

  <!-- NEW -->
  <select id="sortRent" onchange="applyFilters()">
    <option value="">Sort Rent</option>
    <option value="low">Lowest Rent</option>
    <option value="high">Highest Rent</option>
  </select>

  <!-- NEW -->
  <select id="sortDistance" onchange="applyFilters()">
    <option value="">Sort Distance</option>
    <option value="near">Nearest First</option>
    <option value="far">Farthest First</option>
  </select>

  <button onclick="applyFilters()">Filter</button>

  <button onclick="resetFilters()">Reset</button>

</div>

<div class="grid" id="list"></div>

<!-- MAP -->
<div class="modal" id="mapModal"></div>

<!-- PHOTOS -->
<div class="photoModal" id="photoModal">

  <div class="backBtn" onclick="closePhotos()">
    ⬅ Back
  </div>

  <img id="photoView">

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let data = {};
let filteredArray = [];

/* LOAD */
db.ref("properties").on("value",snap=>{

  data = snap.val() || {};

  applyFilters();

});

/* RENDER */
function render(){

  let list = document.getElementById("list");

  list.innerHTML = "";

  if(filteredArray.length===0){
    list.innerHTML="<p style='padding:20px'>No houses found.</p>";
    return;
  }

  filteredArray.forEach(p=>{

    let img = p.images?.[0] || "";

    let statusClass =
      (p.status || "").toLowerCase() === "available"
      ? "available"
      : "occupied";

    list.innerHTML += `

      <div class="card">

        ${img ? `
          <img src="${img}"
          onclick='openPhotos(${JSON.stringify(p.images||[])})'>
        ` : ""}

        <div class="cardContent">

          <b>🏠 ${p.type || ""}</b><br>

          💰 KSh ${p.rent || ""}<br>

          📍 ${p.location || ""}<br>

          📏 ${p.distance || ""} KM from DeKUT<br>

          🧰 ${p.amenities || ""}<br>

          🛏 Rooms Available:
          ${p.rooms || "N/A"}<br>

          💵 Deposit:
          KSh ${p.deposit || "N/A"}<br>

          ⚡ Utilities Included:
          ${p.utilities || "N/A"}<br>

          <div class="badge ${statusClass}">
            ${p.status || "Unknown"}
          </div>

          <br><br>

          <button class="whatsapp"
          onclick="wa('${p.phone}')">
          WhatsApp
          </button>

          <button class="call"
          onclick="call('${p.phone}')">
          Call
          </button>

          <button class="mapbtn"
          onclick="openMap(${p.lat},${p.lng})">
          View on Map
          </button>

          <button class="photos"
          onclick='openPhotos(${JSON.stringify(p.images||[])})'>
          Photos
          </button>

          <!-- NEW -->
          <button class="savebtn"
          onclick='saveHouse(${JSON.stringify(p).replace(/'/g,"&apos;")})'>
          ❤️ Save
          </button>

        </div>

      </div>

    `;
  });
}

/* FILTER + SORT */
function applyFilters(){

  let search =
    document.getElementById("searchBox")
    .value.toLowerCase();

  let min =
    parseInt(document.getElementById("minRent").value)
    || 0;

  let max =
    parseInt(document.getElementById("maxRent").value)
    || 999999;

  let dist =
    parseFloat(document.getElementById("maxDist").value)
    || 999;

  let rentSort =
    document.getElementById("sortRent").value;

  let distanceSort =
    document.getElementById("sortDistance").value;

  filteredArray = [];

  for(let id in data){

    let p = data[id];

    let rent = parseInt(p.rent || 0);

    let distance =
      parseFloat(p.distance || 999);

    let text = (
      (p.location || "") + " " +
      (p.type || "") + " " +
      (p.amenities || "")
    ).toLowerCase();

    let matches =
      search === "" ||
      text.includes(search);

    if(
      rent >= min &&
      rent <= max &&
      distance <= dist &&
      matches
    ){
      filteredArray.push(p);
    }
  }

  /* SORT RENT */
  if(rentSort==="low"){
    filteredArray.sort(
      (a,b)=>(a.rent||0)-(b.rent||0)
    );
  }

  if(rentSort==="high"){
    filteredArray.sort(
      (a,b)=>(b.rent||0)-(a.rent||0)
    );
  }

  /* SORT DISTANCE */
  if(distanceSort==="near"){
    filteredArray.sort(
      (a,b)=>(a.distance||999)-(b.distance||999)
    );
  }

  if(distanceSort==="far"){
    filteredArray.sort(
      (a,b)=>(b.distance||0)-(a.distance||0)
    );
  }

  render();
}

/* RESET */
function resetFilters(){

  document.getElementById("searchBox").value="";
  document.getElementById("minRent").value="";
  document.getElementById("maxRent").value="";
  document.getElementById("maxDist").value="";
  document.getElementById("sortRent").value="";
  document.getElementById("sortDistance").value="";

  applyFilters();
}

/* SAVE HOUSE */
function saveHouse(house){

  let saved =
    JSON.parse(localStorage.getItem("savedHouses") || "[]");

  saved.push(house);

  localStorage.setItem(
    "savedHouses",
    JSON.stringify(saved)
  );

  alert("House saved ❤️");
}

/* WHATSAPP */
function wa(n){
  window.open("https://wa.me/"+n,"_blank");
}

/* CALL */
function call(n){
  window.location.href="tel:"+n;
}

/* SINGLE MAP */
function openMap(lat,lng){

  let m=document.getElementById("mapModal");

  m.style.display="block";

  m.innerHTML=`

    <div class="backBtn"
    onclick="closeMap()">
    ⬅ Back
    </div>

    <div id="map"
    style="width:100%;height:100%"></div>
  `;

  setTimeout(()=>{

    let map=L.map("map")
    .setView([lat,lng],16);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:"© OpenStreetMap"
      }
    ).addTo(map);

    L.marker([lat,lng]).addTo(map);

  },100);
}

/* ALL HOUSES MAP */
function openAllHousesMap(){

  let m=document.getElementById("mapModal");

  m.style.display="block";

  m.innerHTML=`

    <div class="backBtn"
    onclick="closeMap()">
    ⬅ Back
    </div>

    <div id="map"
    style="width:100%;height:100%"></div>
  `;

  setTimeout(()=>{

    let map=L.map("map")
    .setView([-0.3977905,36.9608515],14);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:"© OpenStreetMap"
      }
    ).addTo(map);

    let markers=L.markerClusterGroup();

    for(let id in data){

      let p=data[id];

      if(!p.lat || !p.lng) continue;

      let marker=L.marker([p.lat,p.lng]);

      let photo=p.images?.[0] || "";

      marker.bindPopup(`

        <div style="width:200px">

          ${photo ? `
            <img src="${photo}"
            style="
            width:100%;
            height:120px;
            object-fit:cover;
            border-radius:8px;
            ">
          ` : ""}

          <br>

          <b>${p.type||""}</b><br>

          💰 KSh ${p.rent||""}<br>

          📍 ${p.location||""}<br>

          📏 ${p.distance||""} KM<br>

        </div>

      `);

      markers.addLayer(marker);
    }

    map.addLayer(markers);

  },100);
}

/* CLOSE MAP */
function closeMap(){
  document.getElementById("mapModal")
  .style.display="none";
}

/* PHOTOS */
let imgs=[];
let index=0;
let startX=0;

function openPhotos(images){

  imgs=images||[];

  index=0;

  if(!imgs.length) return;

  photoModal.style.display="block";

  photoView.src=imgs[0];
}

function closePhotos(){
  photoModal.style.display="none";
}

/* SWIPE */
photoModal.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

photoModal.addEventListener("touchend",e=>{

  let endX=e.changedTouches[0].clientX;

  if(endX<startX-50) next();

  if(endX>startX+50) prev();

});

function next(){

  index=(index+1)%imgs.length;

  photoView.src=imgs[index];
}

function prev(){

  index=(index-1+imgs.length)%imgs.length;

  photoView.src=imgs[index];
}

</script>

</body>
</html>
