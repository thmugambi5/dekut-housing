<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f6f6f6;}

header{padding:10px;background:#fff;text-align:center;font-weight:bold;}

/* FILTER + SEARCH */
.filters{
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.filters input{
  padding:6px;
  border:1px solid #ccc;
  border-radius:6px;
  width:160px;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:10px;}

.card{background:#fff;border-radius:10px;overflow:hidden;}
.card img{width:100%;height:180px;object-fit:cover;}

button{margin:4px;padding:6px;border:none;border-radius:6px;cursor:pointer;}
.whatsapp{background:#25D366;color:#fff;}
.call{background:#ff9800;color:#fff;}
.mapbtn{background:#007bff;color:#fff;}
.photos{background:#333;color:#fff;}

.modal,.photoModal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:#000;
}

.photoModal img{width:100%;height:100%;object-fit:contain;}

.backBtn{
  position:absolute;top:10px;left:10px;
  background:white;padding:6px 10px;border-radius:6px;
}
</style>
</head>

<body>

<header>🏠 DeKUT Housing</header>

<!-- ✅ SEARCH + FILTER BAR -->
<div class="filters">

  <input id="searchBox" placeholder="Search (Bomas, wifi, bedsitter...)" oninput="applyFilters()">

  <input id="minRent" type="number" placeholder="Min Rent">
  <input id="maxRent" type="number" placeholder="Max Rent">
  <input id="maxDist" type="number" placeholder="Max Distance (km)">

  <button onclick="applyFilters()">Filter</button>
  <button onclick="resetFilters()">Reset</button>

</div>

<div class="grid" id="list"></div>

<!-- MAP -->
<div class="modal" id="mapModal"></div>

<!-- PHOTOS -->
<div class="photoModal" id="photoModal">
<div class="backBtn" onclick="closePhotos()">⬅ Back</div>
<img id="photoView">
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let data={};
let filteredData={};

/* LOAD */
db.ref("properties").on("value",snap=>{
  data=snap.val()||{};
  filteredData=data;
  render();
});

/* RENDER */
function render(){
  let list=document.getElementById("list");
  list.innerHTML="";

  for(let id in filteredData){
    let p=filteredData[id];
    let img=p.images?.[0]||"";

    list.innerHTML+=`
      <div class="card">

        ${img?`<img src="${img}" onclick='openPhotos(${JSON.stringify(p.images||[])})'>`:""}

        <div style="padding:10px">

          <b>🏠 ${p.type}</b><br>
          💰 KSh ${p.rent}<br>
          📍 ${p.location}<br>
          📏 ${p.distance||""} KM from DeKUT<br>
          🧰 ${p.amenities||""}<br>

          <button class="whatsapp" onclick="wa('${p.phone}')">WhatsApp</button>
          <button class="call" onclick="call('${p.phone}')">Call</button>
          <button class="mapbtn" onclick="openMap(${p.lat},${p.lng})">View on Map</button>
          <button class="photos" onclick='openPhotos(${JSON.stringify(p.images||[])})'>Photos</button>

        </div>

      </div>
    `;
  }
}

/* ✅ SEARCH + FILTER */
function applyFilters(){

  let search = document.getElementById("searchBox").value.toLowerCase();

  let min = parseInt(document.getElementById("minRent").value) || 0;
  let max = parseInt(document.getElementById("maxRent").value) || 999999;
  let dist = parseFloat(document.getElementById("maxDist").value) || 999;

  filteredData={};

  for(let id in data){
    let p=data[id];

    let rent = parseInt(p.rent || 0);
    let distance = parseFloat(p.distance || 999);

    let text = (
      (p.location||"") + " " +
      (p.type||"") + " " +
      (p.amenities||"")
    ).toLowerCase();

    let matchesSearch = search==="" || text.includes(search);

    if(
      rent>=min &&
      rent<=max &&
      distance<=dist &&
      matchesSearch
    ){
      filteredData[id]=p;
    }
  }

  render();
}

/* RESET */
function resetFilters(){
  filteredData=data;

  document.getElementById("searchBox").value="";
  document.getElementById("minRent").value="";
  document.getElementById("maxRent").value="";
  document.getElementById("maxDist").value="";

  render();
}

/* WHATSAPP */
function wa(n){window.open("https://wa.me/"+n,"_blank");}

/* CALL */
function call(n){window.location.href="tel:"+n;}

/* MAP */
function openMap(lat,lng){
  let m=document.getElementById("mapModal");
  m.style.display="block";
  m.innerHTML="<div id='map' style='width:100%;height:100%'></div>";

  setTimeout(()=>{
    let map=L.map("map").setView([lat,lng],16);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      attribution:"© OpenStreetMap"
    }).addTo(map);

    L.marker([lat,lng]).addTo(map);
  },100);
}

document.getElementById("mapModal").onclick=()=>mapModal.style.display="none";

/* PHOTOS */
let imgs=[],index=0,startX=0;

function openPhotos(images){
  imgs=images||[];
  index=0;
  if(!imgs.length)return;

  photoModal.style.display="block";
  photoView.src=imgs[0];
}

function closePhotos(){
  photoModal.style.display="none";
}

/* SWIPE */
photoModal.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

photoModal.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;

  if(endX<startX-50) next();
  if(endX>startX+50) prev();
});

function next(){
  index=(index+1)%imgs.length;
  photoView.src=imgs[index];
}

function prev(){
  index=(index-1+imgs.length)%imgs.length;
  photoView.src=imgs[index];
}

</script>

</body>
</html>
