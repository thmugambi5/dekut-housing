<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f6f6f6;
}

header{
  padding:14px;
  background:#fff;
  text-align:center;
  font-weight:bold;
  font-size:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* ADMIN BAR */
.adminBar{
  display:none;
  background:#111;
  color:white;
  padding:8px;
  text-align:center;
}

.adminBar button{
  background:#e91e63;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* FILTERS */
.filters{
  background:#fff;
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.filters input,
.filters select{
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  width:160px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.cardContent{
  padding:12px;
  line-height:1.7;
}

button{
  margin:4px;
  padding:8px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.whatsapp{background:#25D366;color:#fff;}
.call{background:#ff9800;color:#fff;}
.mapbtn{background:#007bff;color:#fff;}
.photos{background:#333;color:#fff;}
.savebtn{background:#e91e63;color:white;}
.detailsbtn{background:#111;color:white;width:100%;margin-top:10px;}

.modal,
.photoModal,
.detailsModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:9999;
}

.photoModal img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.backBtn{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:8px 12px;
  border-radius:8px;
  z-index:99999;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
  margin-top:4px;
}

.available{background:green;}
.occupied{background:red;}

.detailsContent{
  background:#fff;
  width:100%;
  height:100%;
  overflow:auto;
}

.detailsImage{
  width:100%;
  height:300px;
  object-fit:cover;
}

.detailsBody{
  padding:15px;
  line-height:1.8;
}

</style>
</head>

<body>

<header>🏠 DeKUT Housing</header>

<!-- ADMIN BAR (hidden unless admin logs in) -->
<div class="adminBar" id="adminBar">
  🔐 Admin Mode Active
  <button onclick="goAdmin()">Go to Admin Panel</button>
  <button onclick="logoutAdmin()">Logout</button>
</div>

<div style="text-align:center;padding:10px;">
  <button class="mapbtn" onclick="openAllHousesMap()">
    🗺 View All Houses on Map
  </button>
</div>

<div class="filters">

  <input id="searchBox"
  placeholder="Search (wifi, Bomas, bedsitter...)"
  oninput="applyFilters()">

  <input id="minRent" type="number" placeholder="Min Rent">
  <input id="maxRent" type="number" placeholder="Max Rent">
  <input id="maxDist" type="number" placeholder="Max Distance (km)">

  <select id="sortRent" onchange="applyFilters()">
    <option value="">Sort Rent</option>
    <option value="low">Lowest Rent</option>
    <option value="high">Highest Rent</option>
  </select>

  <select id="sortDistance" onchange="applyFilters()">
    <option value="">Sort Distance</option>
    <option value="near">Nearest First</option>
    <option value="far">Farthest First</option>
  </select>

  <button onclick="applyFilters()">Filter</button>
  <button onclick="resetFilters()">Reset</button>

</div>

<div class="grid" id="list"></div>

<!-- MODALS -->
<div class="modal" id="mapModal"></div>

<div class="photoModal" id="photoModal">
  <div class="backBtn" onclick="closePhotos()">⬅ Back</div>
  <img id="photoView">
</div>

<div class="detailsModal" id="detailsModal">
  <div class="detailsContent" id="detailsContent"></div>
</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain:"dekut-housing.firebaseapp.com",
  databaseURL:"https://dekut-housing-default-rtdb.firebaseio.com",
  projectId:"dekut-housing",
  storageBucket:"dekut-housing.appspot.com",
  messagingSenderId:"784034754945",
  appId:"1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = {};
let filteredArray = [];

/* ---------------- ADMIN SYSTEM ---------------- */

function checkAdmin(){
  let isAdmin = localStorage.getItem("isAdmin");
  if(isAdmin === "true"){
    document.getElementById("adminBar").style.display = "block";
  }
}

function goAdmin(){
  window.location.href = "admin.html";
}

function logoutAdmin(){
  localStorage.removeItem("isAdmin");
  location.reload();
}

/* ---------------- LOAD DATA ---------------- */

db.ref("properties").on("value",snap=>{
  data = snap.val() || {};
  applyFilters();
  checkAdmin();
});

/* ---------------- RENDER ---------------- */

function render(){

  let list = document.getElementById("list");
  list.innerHTML = "";

  if(filteredArray.length===0){
    list.innerHTML = "<p style='padding:20px'>No houses found.</p>";
    return;
  }

  filteredArray.forEach(p=>{

    let img = p.images?.[0] || "";

    let statusClass =
      (p.status || "").toLowerCase() === "available"
      ? "available"
      : "occupied";

    list.innerHTML += `
      <div class="card">

        ${img ? `
          <img src="${img}"
          onclick='openPhotos(${JSON.stringify(p.images||[])})'>
        ` : ""}

        <div class="cardContent">

          <b>🏠 ${p.type || ""}</b><br>
          💰 KSh ${p.rent || ""}<br>
          📍 ${p.location || ""}<br>
          📏 ${p.distance || ""} KM from DeKUT<br>

          <div class="badge ${statusClass}">
            ${p.status || "Unknown"}
          </div>

          <button class="detailsbtn"
          onclick='openDetails(${JSON.stringify(p).replace(/'/g,"&apos;")})'>
          View Details
          </button>

        </div>

      </div>
    `;
  });
}

/* ---------------- FILTER ---------------- */

function applyFilters(){

  let search = document.getElementById("searchBox").value.toLowerCase();
  let min = parseInt(document.getElementById("minRent").value) || 0;
  let max = parseInt(document.getElementById("maxRent").value) || 999999;
  let dist = parseFloat(document.getElementById("maxDist").value) || 999;

  filteredArray = [];

  for(let id in data){

    let p = data[id];

    let rent = parseInt(p.rent||0);
    let distance = parseFloat(p.distance||999);

    let text = ((p.location||"")+" "+(p.type||"")+" "+(p.amenities||"")).toLowerCase();

    let matches = search==="" || text.includes(search);

    if(rent>=min && rent<=max && distance<=dist && matches){
      filteredArray.push(p);
    }
  }

  render();
}

/* ---------------- RESET ---------------- */

function resetFilters(){
  document.getElementById("searchBox").value="";
  document.getElementById("minRent").value="";
  document.getElementById("maxRent").value="";
  document.getElementById("maxDist").value="";
  applyFilters();
}

/* ---------------- NAVIGATION ---------------- */

function openDetails(p){
  document.getElementById("detailsModal").style.display="block";
  document.getElementById("detailsContent").innerHTML = `
    <div class="backBtn" onclick="closeDetails()">⬅ Back</div>
    <div style="padding:20px">
      <h2>${p.type}</h2>
      <p>${p.location}</p>
      <p>KSh ${p.rent}</p>
    </div>
  `;
}

function closeDetails(){
  document.getElementById("detailsModal").style.display="none";
}

/* ---------------- ADMIN CHECK ON LOAD ---------------- */

checkAdmin();

</script>

</body>
</html>
