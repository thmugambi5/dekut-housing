<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore, collection, addDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* YOUR FIREBASE CONFIG (replace later) */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* LOGIN */
window.login = async function(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;

    await signInWithEmailAndPassword(auth,email,pass);
    document.getElementById("auth").style.display="none";
    loadListings();
}

/* REGISTER */
window.register = async function(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;

    await createUserWithEmailAndPassword(auth,email,pass);
}

/* LOGOUT */
window.logout = async function(){
    await signOut(auth);
    document.getElementById("auth").style.display="block";
}

/* ADD PROPERTY (LANDLORD) */
window.addProperty = async function(){
    await addDoc(collection(db,"properties"),{
        type: document.getElementById("type").value,
        rent: document.getElementById("rent").value,
        location: document.getElementById("location").value,
        lat: parseFloat(document.getElementById("lat").value),
        lng: parseFloat(document.getElementById("lng").value),
        phone: document.getElementById("phone").value
    });

    alert("Property added");
}

/* LOAD PROPERTIES */
window.loadListings = async function(){

    let snap = await getDocs(collection(db,"properties"));
    let map = L.map('map').setView([-0.39,37.81],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap'
    }).addTo(map);

    snap.forEach(doc=>{

        let d = doc.data();

        L.marker([d.lat,d.lng])
        .addTo(map)
        .bindPopup(`
            <b>${d.type}</b><br>
            KSh ${d.rent}<br>
            ${d.location}
        `);
    });
}

</script>

<style>
body{font-family:Arial;margin:0;background:#f7f7f7;}
#auth, #dashboard{padding:20px;}
input{display:block;margin:5px;padding:10px;}
button{padding:10px;margin:5px;}
#map{height:500px;}
</style>

</head>

<body>

<!-- AUTH -->
<div id="auth">
<h2>Login</h2>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- LANDLORD DASHBOARD -->
<div id="dashboard">
<h2>Landlord Dashboard</h2>

<input id="type" placeholder="Type">
<input id="rent" placeholder="Rent">
<input id="location" placeholder="Location">
<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">
<input id="phone" placeholder="Phone">

<button onclick="addProperty()">Add Property</button>
<button onclick="logout()">Logout</button>

<div id="map"></div>
</div>

</body>
</html>
