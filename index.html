<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dekut Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px;}

.container{max-width:900px;margin:auto;}

.filters{
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

input,select{
  padding:8px;
  margin:5px;
  border-radius:6px;
  border:1px solid #ccc;
}

.card{
  background:#fff;
  margin:10px 0;
  padding:10px;
  border-radius:10px;
}

img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
}

small{color:gray;}
</style>
</head>

<body>

<div class="container">

<h2>🏠 Dekut Housing Listings</h2>

<!-- FILTERS -->
<div class="filters">

<input id="minRent" type="number" placeholder="Min Rent">
<input id="maxRent" type="number" placeholder="Max Rent">

<input id="maxDistance" type="number" placeholder="Max Distance (km)">

<button onclick="applyFilters()">Apply Filters</button>
<button onclick="resetFilters()">Reset</button>

</div>

<div id="listings"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const DEKUT_LAT = -0.3977905;
const DEKUT_LNG = 36.9608515;

let allProperties = [];

/* DISTANCE CALC */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return (2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1);
}

/* LOAD DATA */
db.ref("properties").on("value", snap=>{
  allProperties = [];

  snap.forEach(child=>{
    let p = child.val();

    if(p.lat && p.lng){
      p.distance = distance(p.lat,p.lng,DEKUT_LAT,DEKUT_LNG);
    } else {
      p.distance = 999;
    }

    allProperties.push(p);
  });

  render(allProperties);
});

/* RENDER */
function render(list){
  let box = document.getElementById("listings");
  box.innerHTML = "";

  list.forEach(p=>{
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${p.type} - KSh ${p.rent}</h3>
      <small>📍 ${p.location || "N/A"} | 📏 ${p.distance} km from DeKUT</small>
      <p>🧰 ${p.amenities || "None"}</p>

      ${p.images && p.images[0] ? `<img src="${p.images[0]}">` : ""}
    `;

    box.appendChild(div);
  });
}

/* FILTER */
function applyFilters(){

  let min = parseInt(document.getElementById("minRent").value) || 0;
  let max = parseInt(document.getElementById("maxRent").value) || 999999;
  let dist = parseFloat(document.getElementById("maxDistance").value) || 999;

  let filtered = allProperties.filter(p=>{
    return (
      parseInt(p.rent || 0) >= min &&
      parseInt(p.rent || 0) <= max &&
      parseFloat(p.distance || 999) <= dist
    );
  });

  render(filtered);
}

/* RESET */
function resetFilters(){
  document.getElementById("minRent").value = "";
  document.getElementById("maxRent").value = "";
  document.getElementById("maxDistance").value = "";
  render(allProperties);
}

</script>

</body>
</html>
