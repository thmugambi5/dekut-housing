<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{font-family:Arial;background:#f7f7f7;margin:0;}
header{background:#fff;padding:15px;text-align:center;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:15px;}

.card{
  background:#fff;
  border-radius:12px;
  padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.meta{font-size:13px;color:#555;}
.price{color:green;font-weight:bold;}
</style>
</head>

<body>

<header>🏠 DeKUT Housing Listings</header>

<div id="grid" class="grid">Loading...</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("properties").on("value", snap => {
  let data = snap.val();
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let id in data){
    let p = data[id];

    let imgs = "";
    if(p.images){
      p.images.forEach(img=>{
        imgs += `<img src="${img}">`;
      });
    }

    grid.innerHTML += `
      <div class="card">
        ${imgs}
        <h3>${p.type}</h3>
        <div class="price">KSh ${p.rent}</div>
        <div class="meta">${p.location}</div>
        <div class="meta">${p.distance} KM from DeKUT</div>
        <div class="meta">${p.gender}</div>
        <div class="meta">${p.amenities}</div>
        <div class="meta">${p.phone}</div>
      </div>
    `;
  }
});

</script>

</body>
</html>
