<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DeKUT Housing Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;}
header{padding:10px;background:#fff;text-align:center;font-weight:bold;}
#map{height:50vh;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:10px;}
.card{background:#fff;padding:10px;border-radius:10px;}
img{width:100%;height:150px;object-fit:cover;border-radius:8px;}
.price{color:green;font-weight:bold;}
</style>
</head>

<body>

<header>🏠 DeKUT Housing Map</header>

<div id="map"></div>
<div class="grid" id="list"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAnVbMha2jEf2NwUxc1YGzOzz4NjJE9S0Q",
  authDomain: "dekut-housing.firebaseapp.com",
  databaseURL: "https://dekut-housing-default-rtdb.firebaseio.com",
  projectId: "dekut-housing",
  storageBucket: "dekut-housing.appspot.com",
  messagingSenderId: "784034754945",
  appId: "1:784034754945:web:198f5e3cf47777ab97f880"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// MAP INIT
let map = L.map("map").setView([-0.390, 37.790], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

db.ref("properties").on("value", snap => {

  let data = snap.val();
  let list = document.getElementById("list");
  list.innerHTML = "";

  for(let id in data){
    let p = data[id];

    // LIST VIEW
    let imgs = "";
    if(p.images){
      imgs = `<img src="${p.images[0]}">`;
    }

    list.innerHTML += `
      <div class="card">
        ${imgs}
        <b>${p.type}</b><br>
        <div class="price">KSh ${p.rent}</div>
        <div>${p.location}</div>
        <div>${p.distance} KM</div>
        <div>${p.phone}</div>
      </div>
    `;

    // MAP MARKER
    if(p.lat && p.lng){

      let marker = L.marker([p.lat, p.lng]).addTo(map);

      marker.bindPopup(`
        <b>${p.type}</b><br>
        KSh ${p.rent}<br>
        ${p.location}<br>
        ${p.phone}
      `);
    }
  }
});

</script>

</body>
</html>
